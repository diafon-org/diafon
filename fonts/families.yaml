# The Diafon families: each derived from a Noto face (SIL OFL 1.1). The three
# share metrics (1000/em, x-height 536, cap 714, ascent 1069, descent -293),
# so the same anchor geometry (fonts/anchor.yaml) serves all, with the
# overrides below: the sans faces take the logo's hooked tail instead of the
# serifed straight stroke (stroke.hook, see anchor.yaml), as wide as their
# stems at the head and a little deeper than p.
serif:
  source: NotoSerif-Regular.ttf
  family: Diafon Serif
  after: Noto Serif
sans:
  source: NotoSans-Regular.ttf
  family: Diafon Sans
  after: Noto Sans
  anchor:
    serif: {w: 0, t: 0}
    stroke:
      hook: {leave: 12, cap: round, reach: 170}
      above_hook: {leave: 30, swing: 62, foot_w: 76, tip_w: 60, rise: 200, gap: 70, bend: [0.4, 0.4]}
                    #   the above-anchor (p̓ g̓): the acute with a little bend like the hook's,
                    #   from a flat foot `gap` over the letter, rising right and bending over
      head_w: 88
      tip_w: 96
      lean_frac: 0.6
      depth: -285
      letters:      # per letter: the anchor's keys, the reverse anchor's under `reverse`.
                    #   leave: along — the hook continues the letter's edge with no kink;
                    #   bend: [k0, k1] — the curve's handles as fractions of the spine (1/3
                    #   each by default; long k0, short k1 = straight, then a late bend);
                    #   rise: the bend starts that high up in the stem, which gives way to it
                    #   extend: the letter's terminal is lengthened first (curl: degrees up)
                    #   and the hook leaves its end; back_along: the anchor grows out of the
                    #   letter's own underside that far back from the far tip, in one bend
                    #   (reverse: from the right tip, down and right; anchor: from the left
                    #   tip, down and left)
        t: {extend: 70, depth: -330, lean_frac: 0.9, reach: 230,
            reverse: {back_along: 80}}
        d: {reverse: {back_along: 80}}
        z: {reverse: {back_along: 80}}
        c: {reverse: {back_along: 80}}
        s: {back_along: 80, reverse: {back_along: null}}   # the anchor, the other way round:
        b: {back_along: 80, reverse: {back_along: null}}   #   from the left tip, back, then down-left
        n: {leave: along, bend: [0.45, 0.3], rise: 220, lean_frac: 0.8}   # one slight bend from up in the stem, m's sweep
        m: {leave: along, bend: [0.45, 0.3], rise: 220}
        x: {leave: along, bend: [0.36, 0.36], lean_frac: 0.4, rise: 240}  # the leg flows on into one even arc
mono:
  source: NotoSansMono-Regular.ttf
  family: Diafon Mono
  after: Noto Sans Mono
  anchor:
    serif: {w: 0, t: 0}
    stroke:
      hook: {leave: 12, cap: round, reach: 170}
      above_hook: {leave: 30, swing: 62, foot_w: 76, tip_w: 60, rise: 200, gap: 70, bend: [0.4, 0.4]}
                    #   the above-anchor (p̓ g̓): the acute with a little bend like the hook's,
                    #   from a flat foot `gap` over the letter, rising right and bending over
      head_w: 88
      tip_w: 96
      lean_frac: 0.6
      depth: -285
      letters:      # per letter: the anchor's keys, the reverse anchor's under `reverse`.
                    #   leave: along — the hook continues the letter's edge with no kink;
                    #   bend: [k0, k1] — the curve's handles as fractions of the spine (1/3
                    #   each by default; long k0, short k1 = straight, then a late bend);
                    #   rise: the bend starts that high up in the stem, which gives way to it
                    #   extend: the letter's terminal is lengthened first (curl: degrees up)
                    #   and the hook leaves its end; back_along: the anchor grows out of the
                    #   letter's own underside that far back from the far tip, in one bend
                    #   (reverse: from the right tip, down and right; anchor: from the left
                    #   tip, down and left)
        t: {extend: 70, depth: -330, lean_frac: 0.9, reach: 230,
            reverse: {back_along: 80}}
        d: {reverse: {back_along: 80}}
        z: {reverse: {back_along: 80}}
        c: {reverse: {back_along: 80}}
        s: {back_along: 80, reverse: {back_along: null}}   # the anchor, the other way round:
        b: {back_along: 80, reverse: {back_along: null}}   #   from the left tip, back, then down-left
        n: {leave: along, bend: [0.45, 0.3], rise: 220, lean_frac: 0.8}   # one slight bend from up in the stem, m's sweep
        m: {leave: along, bend: [0.45, 0.3], rise: 220}
        x: {leave: along, bend: [0.36, 0.36], lean_frac: 0.4, rise: 240}  # the leg flows on into one even arc
