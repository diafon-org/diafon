<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1C1C2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2C2C44;stop-opacity:1" />
    </linearGradient>
    <!-- Key shadow -->
    <filter id="keyShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded rect (icon mask handles clipping on iOS) -->
  <rect width="1024" height="1024" fill="url(#bg)" rx="180"/>

  <!-- Three keyboard keys in a row, slightly rotated for dynamism -->
  <g transform="translate(512,460) rotate(-4)">

    <!-- Left key: L -->
    <g filter="url(#keyShadow)">
      <rect x="-310" y="-110" width="180" height="200" rx="22" fill="#3A3A5C"/>
      <rect x="-310" y="-110" width="180" height="188" rx="22" fill="#4A4A72"/>
    </g>
    <text x="-220" y="-10" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="110" fill="#E8E8F0">L</text>

    <!-- Center key: A -->
    <g filter="url(#keyShadow)">
      <rect x="-100" y="-130" width="200" height="220" rx="22" fill="#5E5EFF" opacity="0.9"/>
      <rect x="-100" y="-130" width="200" height="206" rx="22" fill="#7B7BFF"/>
    </g>
    <text x="0" y="-12" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="124" fill="#FFFFFF">A</text>

    <!-- Right key: 22 -->
    <g filter="url(#keyShadow)">
      <rect x="130" y="-110" width="180" height="200" rx="22" fill="#3A3A5C"/>
      <rect x="130" y="-110" width="180" height="188" rx="22" fill="#4A4A72"/>
    </g>
    <text x="220" y="-28" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-weight="800" font-size="72" fill="#A0A0D0">22</text>
    <text x="220" y="50" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-weight="500" font-size="38" fill="#6060A0">superscript</text>

  </g>

  <!-- Subtle bottom label -->
  <text x="512" y="820" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-weight="600" font-size="72" letter-spacing="8" fill="#6868A8">LATIN</text>
  <text x="512" y="900" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-weight="800" font-size="82" letter-spacing="4" fill="#8888CC">22</text>
</svg>
