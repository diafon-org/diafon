# xcodegen project spec — https://github.com/yonaskolb/XcodeGen
# Generate the Xcode project with:  xcodegen generate
# (install xcodegen:  brew install xcodegen)

name: Latin22

options:
  bundleIdPrefix: com.latin22
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

schemes:
  Latin22:
    build:
      targets:
        Latin22: all
        Latin22Keyboard: all
    run:
      config: Debug
      executable: Latin22
    archive:
      config: Release
  Latin22Keyboard:
    build:
      targets:
        Latin22Keyboard: all
    run:
      config: Debug
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    DEVELOPMENT_TEAM: 28X65QWK28
    CODE_SIGN_STYLE: Automatic

targets:

  # ── Container app ─────────────────────────────────────────────────────────
  Latin22:
    type: application
    platform: iOS
    sources:
      - path: Latin22App
      - path: Latin22Keyboard/Resources/mappings.json
        buildPhase: resources
    info:
      path: Latin22App/Info.plist
      properties:
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
    entitlements:
      path: Latin22App/Latin22.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.latin22.app
        INFOPLIST_FILE: Latin22App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Latin22App/Latin22.entitlements
    dependencies:
      - target: Latin22Keyboard
        embed: true

  # ── Keyboard extension ────────────────────────────────────────────────────
  Latin22Keyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Latin22Keyboard
        excludes:
          - "**/*.json"   # handled as resource below
          - Info.plist
          - "*.entitlements"
      - path: Latin22Keyboard/Resources
        buildPhase: resources
    info:
      path: Latin22Keyboard/Info.plist
      properties:
        CFBundleDisplayName: "Latin22"
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: false
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    entitlements:
      path: Latin22Keyboard/Latin22Keyboard.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.latin22.app.keyboard
        INFOPLIST_FILE: Latin22Keyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: Latin22Keyboard/Latin22Keyboard.entitlements


