site_name: Diafon
site_description: One alphabet for the sounds of many languages.
site_url: https://diafon.io/
repo_url: https://github.com/diafon-org/diafon
edit_uri: ""
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  custom_dir: overrides     # main.html: the home page's tab title
  logo: logo/icon-light.svg
  favicon: logo/icon-rounded.svg
  font: false
  palette:                  # the system's scheme by default; the toggle cycles system, light, dark
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: light
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: the system's setting
  features:
    - navigation.footer
    - navigation.tabs
    - navigation.tabs.sticky      # the page tabs stay in reach when scrolled down
    - navigation.top
    - toc.follow
    - search.suggest
    - content.code.copy

nav:
  - Diafon:                 # the alphabet: the overview and the reference
    - Diafon: index.md
    - Reference: reference.md
  - Font: font.md           # the fonts, the font check, the converter and the dictionaries
  - Input: input/index.md   # the typing's page: docs/input links to input/web

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.snippets:
      base_path:
        - docs/.include
      check_paths: true

hooks:
  - scripts/site_hooks.py    # copies the dictionaries beside the site for the converter

extra_css:
  - assets/diafon.css

extra_javascript:
  - assets/site.js

copyright: "Diafon · working draft · code MIT, fonts OFL 1.1, text CC BY 4.0"
