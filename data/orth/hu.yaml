# No context rules: the glide /j/ is written explicitly (ix -> j), so i is always the vowel.
# ---- loose input (opt-in typing shortcuts; the canonical map above stays the source of truth) ----
# Hungarian has no cardinal /a/ or /e/, so the bare letters are free for the short a and e.
_lazy:
  a: a
  e: e

# ---- adoption groups: which native spellings a learner switches off TOGETHER ----
# Turning a group off makes those labels render as their universal glyph instead, so switching
# every group off lands exactly on the uni view. Hungarian's accented vowels are NOT here:
# á é í ó ú ö ü ő ű already render identically in both.
_groups:
  digraphs: [sj, s, tj, dj, nj, zj, tq, dc, dq]   # s sz ty gy ny zs cs dz dzs
  short-vowels: [ac, ej]                          # the bare a and e conventions

_rules: []
