# notation label -> ZH grapheme. Decoder: src/diaphone/decode.py
a: a
aq: er
ax: e
f: f
i: i
ic: ü
k: g
ky: k
kx: h
l: l
m: m
n: n
nx: ng
oc: e
p: b
py: p
r: r
s: s
sj: sh
t: d
tc: z
tcy: c
ty: t
tq: zh
tqy: ch
u: u
uc: i

# Context rules (ordered, first match wins; no match -> the map above). Same schema as hu.yaml.
# ---- loose input: "type Pinyin" ----
# The sibilant/affricate initials + o spell themselves literally, so xiao=xiǎo, shi=shì, zhong=zhōng.
# The one set NOT added is the aspirated stops p/t/k — they clash with the notation, where p/t/k are
# the LENIS series, so canonical still decodes in loose mode; use py/ty/ky for the aspirated stops.
_lazy:
  b: b
  d: d
  g: g
  z: z
  c: c
  zh: zh
  ch: ch
  sh: sh
  r: r
  j: j
  q: q
  x: x
  h: h
  e: e
  o: o

# ---- adoption groups ----
_groups:
  # A group with an EMPTY label list switches off behaviour rather than spellings: the context
  # rules tagged with that group name, or (for `tones`) the Pinyin tone marks, leaving the plain
  # digit the universal view uses. With every group here off, the zh target IS the uni view.
  tones: []
  palatal-spelling: []
  zero-initial: []
  finals: []
  stops: [p, py, t, ty, k, ky]          # Pinyin b p d t g k — our lenis/aspirated pairs
  sibilants: [tc, tcy, tq, tqy, sj]     # z c zh ch sh
  other-consonants: [kx, nx]            # h ng
  vowels: [ax, oc, uc, aq]              # e (both), the apical i, er

_rules:
  # merged retroflex/alveolo-palatal series: j/q/x before front i/ü, else zh/ch/sh (the map above)
  - {t: tq,  next: [i, ic], g: j, group: palatal-spelling}
  - {t: tqy, next: [i, ic], g: q, group: palatal-spelling}
  - {t: sj,  next: [i, ic], g: x, group: palatal-spelling}
  - {t: ic, prev: [tq, tqy, sj], g: u, group: palatal-spelling}     # ü is written "u" after j/q/x (ju, qu, xu)
  # zero-initial syllables take the Pinyin y-/w- spellings (specific rules before general)
  - {t: i, first: true, next: [u], g: yo, group: zero-initial}       # iou -> you
  - {t: u, first: true, next: [i], g: we, group: zero-initial}       # uei -> wei
  - {t: u, first: true, next: [n, nx], g: we, group: zero-initial}   # uen/ueng -> wen/weng
  - {t: i, first: true, next_vowel: true, g: y, group: zero-initial}   # i-glide onset -> y- (ya, ye, yao …)
  - {t: i, first: true, g: yi, group: zero-initial}                  # yi, yin, ying
  - {t: u, first: true, next_vowel: true, g: w, group: zero-initial}   # wa, wo, wai, wan …
  - {t: u, first: true, g: wu, group: zero-initial}                  # wu
  - {t: ic, first: true, g: yu, group: zero-initial}                 # yu, yue, yuan, yun
  - {t: u, prev: [p, py, m, f], next: [o], g: "", group: finals}   # bo po mo fo — the u is not written
  - {t: u, prev: [a], g: o, group: finals}                # -u offglide spells "o" only after a (au->ao; ou/uo keep u)
