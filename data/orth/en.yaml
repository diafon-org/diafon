# ---- loose input: the familiar digraphs, plus bare j/y/w and the orthographic vowel pairs ----
# All free letters in English, which has no length, nasal vowels or emphatics.
_lazy:
  sh: sh
  ch: ch
  zh: zh
  ng: ng
  th: th
  dh: th
  j: j
  y: y
  w: w
  ee: ee
  oo: oo
  er: er
  ay: ay
  ow: ow
  aw: aw
  oy: oy
  uh: u

# ---- adoption groups ----
_groups:
  consonant-digraphs: [sj, zj, tq, dq, ty, dy, ny]   # sh zh ch j th th ng
  vowel-respellings: [i, ij, e, ej, o, oj, u, uj, ac, ax, aq]
  glides: [ix]                                        # y
