# One label per general point. Flat: base + ONE operator. No tier, no case, no diacritics.
# LAW: a modifier letter never has a phoneme twin — so no label can re-read as a phoneme sequence.
# CONSONANT BASES: p b t d k g m n f v s z l h · trill r.  `h` is ONLY a base, never a modifier.
# CONSONANT OPERATORS (never a bare label):  c=affricate  q=hush  x=dental/velar  j=palatal  w=long
#   coronal fan:  tc=/ts/ · tq=/tʃ/ · tx=/θ/      (fricatives: sj=/ʃ/)
# NOT points: the palatal coronals. /c ɟ ɲ ʎ/ ARE /t d n l/ + palatalized — no language contrasts
#   them with the soft series, and the difference is phonetic. So HU ty = RU ть = `tj`, ES ñ = `nj`.
# Gutturals: the whole block sits on `h` — h · hx=/ħ/ (`x`=the fricative one step back, x's meaning
#   everywhere) · hj=/ʕ/ (`j`=the marked second guttural) · hq=/ʔ/. `hq` has no glyph the mark grammar
#   can build (see uni.py), so it takes a whole character in the uni view — the apostrophe ', which is
#   the glottal stop across the world's Latin orthographies — as c=/ts/, x=/dz/, q=/q/ take letters.
#   Aspiration is single `y` on a
#   consonant (py ty ky = /pʰ tʰ kʰ/); emphatics are the doubled `yy` (tyy=/tˤ/).
# VOWEL BASES: a e i o u (the cardinals; `y` is not a base). VOWEL OPERATORS: c=toggle-rounding,
#   j=lower one step, q=c+j (front-round lowered), x=centralise→schwa. Triangular.

consonants:
  p: p
  b: b
  t: t
  d: d
  k: k
  g: g
  q: kq          # uvular stop
  ʔ: hq          # glottal stop = h + `q`; the one h-point the mark grammar cannot draw, so it takes
                 #   a whole character in the uni view: ' — the glottal stop across the world's
                 #   Latin orthographies (Hawaiian ʻokina, Mayan, Tagalog) and hamza in ASCII Arabic.
  m: m
  n: n
  ŋ: ny          # the EXOTIC n (one dot, ṇ): English sing. ɳ takes the freed nx (anti-comma).
  ts: tc         # affricate operator c  (Pinyin c = /ts/)
  dz: dc
  pf: py         # the EXOTIC p (ṗ): German pf — and Mandarin pʰ, the same slot read per language.
  tʃ: tq         # hush affricate, operator q (Pinyin q); absorbs tɕ tʂ — no sign
  dʒ: dq         # absorbs dʑ
  f: f
  v: v
  θ: ty          # the EXOTIC t (ṭ): English thank, Arabic ث — and ZH/TH/KO/VI/HI/BN tʰ. NO
                 #   language pairs /θ/ with /tʰ/, so the slot never clashes within one language.
  ð: dy          # the EXOTIC d (ḍ): English this, Arabic ذ — and HI/BN dʱ (breathy). Arabic is
                 #   the ONE language stacking two specials on d (ð + dˤ), so ð=dy and dˤ=dx.
  s: s
  z: z
  ʃ: sj          # hush fricative = palatal `j` (Hungarian s); absorbs ɕ ʂ — no sign
  ʒ: zj          # absorbs ʐ-fricative
  x: kx          # velar fricative
  ɣ: gx
  ħ: hx          # voiceless pharyngeal fricative = h + `x`, the fricative ONE STEP BACK — x's meaning
                 #   everywhere (tx=θ, kx=x). uni ḥ, which is how the world writes ح (Muḥammad).
  h: h
  l: l
  ʕ: hj          # voiced pharyngeal fricative = h + `j`, the marked second guttural — uni h̦
  r: r           # trill = the generic R slot; also absorbs the retroflex approximant ɻ (EN/ZH ⟨r⟩) and ɹ
  ɾ: rc          # tap (marked; the rarer rhotic — Spanish perro/pero). `c` on r, so `j` on r stays
                 #   PALATAL: /rʲ/ = rj, one j, one comma, like every other soft consonant.

vowels:
  i: i
  e: e
  a: a
  o: o
  u: u
  # Triangular vowel model (see docs/index.html). Bases i e a o u sit on the edges;
  # everything else is base + ONE operator:
  #   c = toggle rounding (front gains it: ic=y, ec=ø; back loses it: uc=ɯ, oc=ɤ; apex marks back: ac=ɑ)
  #   j = LOWER one step, uniformly — each in-between vowel is its higher neighbour lowered:
  #       ij=ɪ, ej=ɛ, uj=ʊ, oj=ɔ. `a` is already lowest, so `aj` is unused.
  #   q = c+j, front-round lowered (iq=ʏ, eq=œ)   ·   x = centralise → schwa (ax=ə)
  #   ɒ merged into ɑ (=ac): HU short a is open back, adjacent to ɑ; only HU had it. So HU á/a = a/ac.
  y: ic          # close front rounded  (i + round)
  ø: ec
  ɯ: uc          # close back UNrounded  (u de-rounded)
  ɤ: oc
  ɪ: ij          # front, one step down
  ɛ: ej
  ʊ: uj          # back, one step down (from u)
  ɔ: oj          # back, one step down (from o) — o-based (the lowered o)
  ʏ: iq          # front-round in-between  (c + j) — French œ, German ʏ keep this operator alive
  œ: eq
  ɑ: ac          # open back  (apex: rounding is moot, so c marks the back one)
  ə: ax          # schwa = the centre; centralise. (`y` is not a vowel base — it is the modifier letter.)

# THE EXOTIC LADDER (Sz): frequent, widespread phenomena earn dedicated notation; a rare,
# language-specific quality rides an EXOTIC SLOT whose reading the language defines. `y` is the
# first exotic letter (glyph: ONE DOT — ṭ ḍ ṇ ṣ ẓ ṗ …), `x` the second (glyph: the ANTI-COMMA —
# t̖ d̖ n̖ …), used only where a language stacks TWO specials on one base (AR θ+tˤ, HI t̪ʰ+ʈ).
# They are NOT a progression — when both appear they are different phenomena. A slot may read
# differently per language (ty = EN θ, ZH tʰ) but may NEVER carry two sounds within one language
# (`notation.find_shared_labels` proves it; the cross-language overloads live in the exotic
# registry the CLI prints). NO letter ever doubles.
modifiers:       # each is just a letter — no separate tier
  long: w            # tw = /tː/ · iw = /iː/
  palatalized: j     # /Cʲ/ = Cj (pj tj dj nj lj kj …). Where the palatal slot is occupied (sj zj
                     #   are the hush points; tc's glyph c̦ is tq), that palatalization IS the
                     #   language's exotic and spells `y`: /sʲ zʲ tsʲ/ = sy zy tcy (RU UK ET).
  aspirated: "y"     # the exotic letter directly: py ty ky tcy tqy = /pʰ tʰ kʰ tsʰ tʃʰ/. `y` has no
                     #   phoneme twin, so Cy never re-reads; Ch is simply the sequence /C/+/h/
                     #   (uphill, Korean 국화). ty ALSO carries the θ point — no language has both.
  pharyngealized: "y" # the Arabic emphatics are the exotic slots: sˤ zˤ = sy zy (ṣ ẓ — the
                     #   scholarly transliteration exactly). On t d the first slot is θ ð, which
                     #   Arabic HAS, so tˤ dˤ take the SECOND exotic: tx dx (t̖ d̖).
  nasal: "y"         # vowels only: ay = /ã/. Base-dependent: `y` is the exotic on a consonant,
                     #   nasal on a vowel. Renders as the tilde.
  rhotic: q          # English /ɝ/ = axq (irregular short label `aq`). `q` does nothing on a central
                     #   vowel, so the slot is free and unambiguous — the trill `r` is a base and
                     #   could never carry it (axr must read /ə/+/r/).
  retroflex: x       # the second-exotic letter directly: ʈ ɖ ɳ = tx dx nx (freed by θ ð ŋ moving to
                     #   the y-slots) · ɭ ɻ = lx rx · the hush layer sjx zjx tqx dqx (PL sz ż cz dż,
                     #   glyph: the comma flipped). x never stands alone, so nothing re-reads.
  nonsyllabic: x     # GLIDES = reduced close vowels: ix=/j/ ux=/w/ icx=/ɥ/ ucx=/ɰ/. One story for
                     #   `x` on a vowel: REDUCE — `a` reduces to the schwa POINT (ax=/ə/), the close
                     #   vowels reduce to non-syllabic (the modifier) — the same point-if-exists-
                     #   else-modifier rule as c/j/q. `x` is never a phoneme, so Cx/Vx cannot re-read;
                     #   glides as base letters (j, w) would collide with every Cj label instead.
