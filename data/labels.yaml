# One label per general point. Flat: base + ONE operator. No tier, no case, no diacritics.
# CONSONANT BASES: p b t d k g m n f v s z l h · trill r.
# CONSONANT OPERATORS (never a bare label):  c=affricate  q=hush  x=dental/velar  j=palatal  w=long
#   coronal fan:  tc=ts · tq=tʃ · tx=θ · tj=tʲ (= /c/, Hungarian ty)      (fricatives: sj=ʃ)
# Off-grid rarities use fixed combos: gutturals ʔ=hj ħ=hq ʕ=hx ; emphatics ride on `qx`.
# VOWEL BASES: a e i o u (the cardinals; `y` is NOT a base anymore). VOWEL OPERATORS: c=toggle-rounding,
#   j=lax, q=c+j (front-round lax), x=centralise→schwa. Triangular; see docs/viz/vowel-triangle.html.

consonants:
  p: p
  b: b
  t: t
  d: d
  k: k
  g: g
  c: tj          # palatal stop = palatalised /t/ (Hungarian ty); frees kj for /kʲ/
  ɟ: dj          # palatal stop = palatalised /d/ (Hungarian gy)
  q: kq          # uvular stop
  ʔ: hj          # glottal stop (off-grid random combo)
  m: m
  n: n
  ɲ: nj          # palatal nasal (= palatalised /n/)
  ŋ: nx
  ts: tc         # affricate operator c  (Pinyin c = /ts/)
  dz: dc
  pf: pc
  tʃ: tq         # hush affricate, operator q (Pinyin q); absorbs tɕ tʂ — no sign
  dʒ: dq         # absorbs dʑ
  f: f
  v: v
  θ: tx
  ð: dx
  s: s
  z: z
  ʃ: sj          # hush fricative = palatal `j` (Hungarian s); absorbs ɕ ʂ — no sign
  ʒ: zj          # absorbs ʐ-fricative
  x: kx          # velar fricative
  ɣ: gx
  ħ: hq          # voiceless pharyngeal fricative (off-grid combo)
  ʕ: hx          # voiced pharyngeal fricative
  h: h
  l: l
  ʎ: lj          # palatal lateral (= palatalised /l/)
  ʐ: rx          # retroflex approximant (Mandarin r)
  r: r           # trill = the base rhotic (8 languages); geminate/long trill = rw (forró)
  ɾ: rj          # tap (marked; the rarer rhotic — 3 languages)

vowels:
  i: i
  e: e
  a: a
  o: o
  u: u
  # Triangular vowel model (see docs/viz/vowel-triangle.html). Bases i e a o u sit on the edges;
  # everything else is base + ONE operator:
  #   c = toggle rounding (front gains it: ic=y, ec=ø; back loses it: uc=ɯ, oc=ɤ; apex marks back: ac=ɑ)
  #   j = lax (ij=ɪ, ej=ɛ, uj=ʊ, oj=ɔ)   ·   q = c+j, front-round lax (iq=ʏ, eq=œ)
  #   x = centralise → schwa (ax=ə)      ·   ɒ merged into ɔ (only HU had it; no lang contrasts ɒ~ɔ)
  y: ic          # close front rounded  (i + round)
  ø: ec
  ɯ: uc          # close back UNrounded  (u de-rounded)
  ɤ: oc
  ɪ: ij          # lax
  ɛ: ej
  ʊ: uj
  ɔ: oj
  ʏ: iq          # front-round lax  (c + j) — French œ, German ʏ keep this operator alive
  œ: eq
  ɑ: ac          # open back  (apex: rounding is moot, so c marks the back one)
  ə: ax          # schwa = the centre; centralise. Base letter `y` is retired.

modifiers:       # each is just a letter/combo — no separate tier
  long: w            # tw = tː · iw = iː
  palatalized: j     # Cʲ = Cj (pj tj kj …); but on s/z it DOUBLES to jj (sʲ=sjj, zʲ=zjj),
                     #   because sj/zj are the hush ʃ/ʒ — Russian шёл/сёл, ж/зь force the split
  pharyngealized: qx # tqx = tˤ  (Arabic emphatics — a fixed combo, like the gutturals)
  labialized: c      # kc = kʷ, gc = gʷ  (c = round, as on vowels). Base-dependent like the other
                     #   operators (x is dental on tx=θ, velar on kx=x): c is the affricate on stops
                     #   that HAVE one, but k/g have no affricate, so kc/gc are free for labialised.
                     #   Bare `u` was wrong: ku = /kʷ/ collided with /k/+/u/ (Latin quī/cui). Only
                     #   Latin kʷ gʷ exist; the notation-decodability invariant guards against a
                     #   future labialised p/t (pc=pf, tc=ts would collide — it would flag).
  aspirated: h       # ph = pʰ
  nasal: h           # vowels only: ah = ã  (h = aspiration on C, nasal on V; French has no /h/ and
                     #   only French has nasal vowels, so the two never collide)
  rhotic: r          # English ɝ = yr (schwa + r)
