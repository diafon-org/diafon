# One label per general point. Flat: base + ONE operator. No tier, no case, no diacritics.
# CONSONANT BASES: p b t d k g m n f v s z l h · trill r.
# CONSONANT OPERATORS (never a bare label):  c=affricate  q=hush  x=dental/velar  j=palatal  w=long
#   coronal fan:  tc=ts · tq=tʃ · tx=θ · tj=tʲ (= /c/, Hungarian ty)      (fricatives: sj=ʃ)
# Gutturals form a 2×2 on `h` via the c/j/q pattern (like tc/tj/tq, where q = c+j): `c`=pharyngeal
#   (deeper), `j`=the marked second sound (glottal stop / voiced), `q`=c+j=both. So h · hj=ʔ · hc=ħ ·
#   hq=ʕ — base + ONE operator each (mirrors the native h · ḥ · ħ · ħ̣). Emphatics ride on `y` (ty=tˤ).
# VOWEL BASES: a e i o u (the cardinals; `y` is NOT a base anymore). VOWEL OPERATORS: c=toggle-rounding,
#   j=lower one step, q=c+j (front-round lowered), x=centralise→schwa. Triangular.

consonants:
  p: p
  b: b
  t: t
  d: d
  k: k
  g: g
  c: tj          # palatal stop = palatalised /t/ (Hungarian ty); frees kj for /kʲ/
  ɟ: dj          # palatal stop = palatalised /d/ (Hungarian gy)
  q: kq          # uvular stop
  ʔ: hj          # glottal stop = h + `j` (marked second sound at the glottis: the stop)
  m: m
  n: n
  ɲ: nj          # palatal nasal (= palatalised /n/)
  ŋ: nx
  ts: tc         # affricate operator c  (Pinyin c = /ts/)
  dz: dc
  pf: pc
  tʃ: tq         # hush affricate, operator q (Pinyin q); absorbs tɕ tʂ — no sign
  dʒ: dq         # absorbs dʑ
  f: f
  v: v
  θ: tx
  ð: dx
  s: s
  z: z
  ʃ: sj          # hush fricative = palatal `j` (Hungarian s); absorbs ɕ ʂ — no sign
  ʒ: zj          # absorbs ʐ-fricative
  x: kx          # velar fricative
  ɣ: gx
  ħ: hc          # voiceless pharyngeal fricative = h + `c` (pharyngeal = one step deeper)
  ʕ: hq          # voiced pharyngeal fricative = h + `q` (q = c+j: pharyngeal + marked = voiced)
  h: h
  l: l
  ʎ: lj          # palatal lateral (= palatalised /l/)
  r: r           # trill = the generic R slot; also absorbs the retroflex approximant ɻ (EN/ZH ⟨r⟩) and ɹ
  ɾ: rj          # tap (marked; the rarer rhotic — Spanish perro/pero)

vowels:
  i: i
  e: e
  a: a
  o: o
  u: u
  # Triangular vowel model (see docs/index.html). Bases i e a o u sit on the edges;
  # everything else is base + ONE operator:
  #   c = toggle rounding (front gains it: ic=y, ec=ø; back loses it: uc=ɯ, oc=ɤ; apex marks back: ac=ɑ)
  #   j = LOWER one step, uniformly — each in-between vowel is its higher neighbour lowered:
  #       ij=ɪ, ej=ɛ, uj=ʊ, oj=ɔ. `a` is already lowest, so `aj` is unused.
  #   q = c+j, front-round lowered (iq=ʏ, eq=œ)   ·   x = centralise → schwa (ax=ə)
  #   ɒ merged into ɑ (=ac): HU short a is open back, adjacent to ɑ; only HU had it. So HU á/a = a/ac.
  y: ic          # close front rounded  (i + round)
  ø: ec
  ɯ: uc          # close back UNrounded  (u de-rounded)
  ɤ: oc
  ɪ: ij          # front, one step down
  ɛ: ej
  ʊ: uj          # back, one step down (from u)
  ɔ: oj          # back, one step down (from o) — o-based (the lowered o)
  ʏ: iq          # front-round in-between  (c + j) — French œ, German ʏ keep this operator alive
  œ: eq
  ɑ: ac          # open back  (apex: rounding is moot, so c marks the back one)
  ə: ax          # schwa = the centre; centralise. Base letter `y` is retired.

modifiers:       # each is just a letter/combo — no separate tier
  long: w            # tw = tː · iw = iː
  palatalized: j     # Cʲ = Cj (pj tj kj …); but on s/z it DOUBLES to jj (sʲ=sjj, zʲ=zjj),
                     #   because sj/zj are the hush ʃ/ʒ — Russian шёл/сёл, ж/зь force the split
  pharyngealized: "y" # ty = tˤ  (Arabic emphatics). Base-dependent like c/j: `y` is NASAL on a vowel
                     #   (ay=ã) but PHARYNGEALISED on a consonant — `y` is unused on consonants, so it's
                     #   free there. Base + ONE operator now (was the `qx` combo); ðˤ = dxy, not dxqx.
  labialized: c      # kc = kʷ, gc = gʷ  (c = round, as on vowels). Base-dependent like the other
                     #   operators (x is dental on tx=θ, velar on kx=x): c is the affricate on stops
                     #   that HAVE one, but k/g have no affricate, so kc/gc are free for labialised.
                     #   Bare `u` was wrong: ku = /kʷ/ collided with /k/+/u/ (Latin quī/cui). Only
                     #   Latin kʷ gʷ exist; the notation-decodability invariant guards against a
                     #   future labialised p/t (pc=pf, tc=ts would collide — it would flag).
  aspirated: h       # ph = pʰ  (on consonants)
  nasal: "y"         # vowels only: ay = ã.  A DEDICATED operator on the one free letter (`y`, the retired
                     #   vowel base) — not `h` (also the /h/ base) and not a symbol. Renders as the tilde.
  rhotic: q          # English ɝ = axq. `q` does nothing on a central vowel, so the slot is free and
                     #   UNAMBIGUOUS — unlike the old `r`, which overloaded the trill (axr = /ɝ/ vs /ə/+/r/).
