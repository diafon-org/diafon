# The script: the letters, the marks and the points they compose.
#
# A point is a letter and its marks. A consonant's mark sits below, and
# floats above on the letters that descend (the float rule); no capital
# descends, so a capital always wears its mark below. A vowel wears at most
# one mark above and one below, and the acute when long (the flip and the
# acute fuse into the double acute). A long consonant doubles its letter.
# The combining marks are approximations until the Diafon fonts carry the
# true attached anchor.

letters:
  consonants: [b, c, d, f, g, h, j, k, l, m, n, p, r, s, t, v, w, x, z]
  vowels: [a, e, i, o, u]

descenders: [g, j, p, y]

marks:
  anchor:        {below: "̦", above: "̓"}   # the anchor: the hush, the soft consonants
  dot:           {below: "̣", above: "̇"}   # the fricative shift
  twodots:       {below: "̤", above: "̈"}   # the double dot below: the tongue pulled back (retroflex, emphatic, pharyngeal)
  underdot:      {below: "̣"}                    # on a vowel: the more open vowel of an area (ɪ ɛ ɔ)
  acute:         {above: "́"}                    # a long vowel
  double_acute:  {above: "̋"}                    # the flip and the acute, fused
  flip:          {above: "̈"}                    # the front rounded and back unrounded vowels; on a, the schwa /ə/;
                                                 #   on j w r, the rounded glides and the vocalic r

# The points, by name (the canonical IPA value, split.md): letter, then marks.
# Every point has a long partner, named with ː: a vowel takes the acute, a
# consonant doubles. A letter with marks that no point here names is still
# script (an open composition): it reads and writes, and has no name yet.
points:
  # consonants
  b: b
  bʲ: b anchor
  ts: c
  tʃ: c anchor
  tɕ: c dot
  d: d
  ɟ: d anchor
  ð: d dot
  ɖ: d twodots
  f: f
  fʲ: f anchor
  g: g
  gʲ: g anchor
  ɣ: g dot
  ʕ: g twodots
  h: h
  ʔ: h dot
  ħ: h twodots
  j: j
  k: k
  kʲ: k anchor
  x: k dot
  q: k twodots
  l: l
  ʎ: l anchor
  ɭ: l dot
  m: m
  mʲ: m anchor
  ⁿ: m dot            # the nasal letter: after a vowel (and its glide) it makes the vowel nasal, as h aspirates
  n: n
  ɲ: n anchor
  ŋ: n dot
  ɳ: n twodots
  p: p
  pʲ: p anchor
  r: r
  rʲ: r anchor
  ɾ: r dot
  ɝ: r flip
  s: s
  ʃ: s anchor
  ɕ: s dot
  sˤ: s twodots
  t: t
  c: t anchor
  θ: t dot
  ʈ: t twodots
  v: v
  vʲ: v anchor
  w: w
  ɥ: w flip         # the glide of ü, on the consonant of the letter ü is drawn on (i j, u w, ü ẅ)
  dz: x
  dʒ: x anchor
  dʑ: x dot
  z: z
  ʒ: z anchor
  ʑ: z dot
  ðˤ: z twodots
  # vowels
  a: a
  ə: a flip
  e: e
  ɤ: e flip
  ɛ: e underdot
  i: i
  ɯ: i flip
  ɪ: i underdot
  o: o
  ø: o flip
  ɔ: o underdot
  u: u
  y: u flip

# Tones: one contour is one sign in every language, written after the
# syllable, the marks Bopomofo uses (mid unmarked, as in Thai and Vietnamese
# spelling); `number` is the contour's place in the standard tone vocabulary
# (data/README.md), which the numbered spellings write (pinyin ma3). The
# Diafon fonts draw the signs with a shape above the syllable (calt,
# fonts/tools/build_font.py TONE_SHAPES); the text keeps the sign after it.
tones:
  high: {number: 1, sign: "ˉ"}
  rising: {number: 2, sign: "ˊ"}
  dipping: {number: 3, sign: "ˇ"}
  falling: {number: 4, sign: "ˋ"}
  mid: {number: 5, sign: ""}
  low: {number: 6, sign: "ˍ"}
  glottal-rising: {number: 7, sign: "˜"}
  glottal-low: {number: 8, sign: "ˀ"}
