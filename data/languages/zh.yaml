# Mandarin (Standard)  [ZH]
name: Mandarin (Standard)
family: Sinitic
tone: true
consonants:
- {ipa: p, pl: bilabial, mn: plosive, vc: vl, orth: b}
- {ipa: t, pl: alveolar, mn: plosive, vc: vl, orth: d}
- {ipa: k, pl: velar, mn: plosive, vc: vl, orth: g}
- {ipa: ts, pl: alveolar, mn: affricate, vc: vl, orth: z}
# The alveolo-palatal series j/q/x [tɕ tɕʰ ɕ] is NOT phonemic: it is in complementary
# distribution with zh/ch/sh (retroflex) — it occurs only before /i y/, where the retroflexes
# never do — so it is an allophone, not a separate point (cf. the ç/ɸ removals). Only the
# retroflex series is entered.
- {ipa: tʂ, pl: postalveolar, mn: affricate, vc: vl, orth: zh, note: 'realised [tʂ]; complementary with [tɕ], so unmarked'}
- {ipa: f, pl: labiodental, mn: fricative, vc: vl}
- {ipa: s, pl: alveolar, mn: fricative, vc: vl}
- {ipa: ʂ, pl: postalveolar, mn: fricative, vc: vl, orth: sh, note: 'realised [ʂ]; [ɕ] before /i y/ is the allophone j/x — complementary, so unmarked'}
- {ipa: x, pl: velar, mn: fricative, vc: vl, orth: h}
- {ipa: ʐ, pl: retroflex, mn: approximant, vc: vd, orth: r}
- {ipa: m, pl: bilabial, mn: nasal, vc: vd}
- {ipa: n, pl: alveolar, mn: nasal, vc: vd}
- {ipa: ŋ, pl: alveolar, mn: nasal, vc: vd, mod: [exotic], note: coda only}
- {ipa: l, pl: alveolar, mn: lateral-approximant, vc: vd}
vowels:
- {ipa: i, hi: close, bk: front, rd: false}
- {ipa: y, hi: close, bk: front, rd: true, orth: ü}
- {ipa: u, hi: close, bk: back, rd: true}
- {ipa: ɤ, hi: close-mid, bk: back, rd: false, orth: e}
- {ipa: ə, hi: mid, bk: central, rd: false}
- {ipa: a, hi: open, bk: central, rd: false}
secondary_series:
- type: aspirated
  applies_to: [p, t, k, ts, tʂ]
