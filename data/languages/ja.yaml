# Japanese (Tokyo)  [JA]
name: Japanese (Tokyo)
family: Japonic
pitch: true      # lexical pitch accent (hashi 箸/橋) — suprasegmental, not per segment
consonants:
- {ipa: p, pl: bilabial, mn: plosive, vc: vl}
- {ipa: b, pl: bilabial, mn: plosive, vc: vd}
- {ipa: t, pl: alveolar, mn: plosive, vc: vl}
- {ipa: d, pl: alveolar, mn: plosive, vc: vd}
- {ipa: k, pl: velar, mn: plosive, vc: vl}
- {ipa: g, pl: velar, mn: plosive, vc: vd}
- {ipa: ts, pl: alveolar, mn: affricate, vc: vl}
- {ipa: dz, pl: alveolar, mn: affricate, vc: vd}
- {ipa: tɕ, pl: alveolopalatal, mn: affricate, vc: vl}
- {ipa: dʑ, pl: alveolopalatal, mn: affricate, vc: vd}
- {ipa: s, pl: alveolar, mn: fricative, vc: vl}
- {ipa: z, pl: alveolar, mn: fricative, vc: vd}
- {ipa: ɕ, pl: alveolopalatal, mn: fricative, vc: vl}
- {ipa: h, pl: glottal, mn: fricative, vc: vl, note: '[ɸ] before /u/ and [ç] before /i/ are allophones of /h/, not separate phonemes'}
- {ipa: m, pl: bilabial, mn: nasal, vc: vd}
- {ipa: n, pl: alveolar, mn: nasal, vc: vd}
- {ipa: r, pl: alveolar, mn: tap, vc: vd, note: single liquid}
vowels:
- {ipa: i, hi: close, bk: front, rd: false}
- {ipa: e, hi: close-mid, bk: front, rd: false}
- {ipa: a, hi: open, bk: central, rd: false}
- {ipa: o, hi: close-mid, bk: back, rd: true}
- {ipa: ɯ, hi: close, bk: back, rd: false, orth: u}
# glides = nonsyllabic close vowels (labels ix/ux/icx via the x=reduce modifier)
- {ipa: j, hi: close, bk: front, rd: false, mod: [nonsyllabic], orth: y, note: や row}
- {ipa: w, hi: close, bk: back, rd: true, mod: [nonsyllabic], orth: w, note: 'わ — entered as plain /w/; no language contrasts w~ɰ (witness principle), phonetically [ɰ~w̜]'}
long_series: [i, e, a, o, ɯ]
gemination: true
