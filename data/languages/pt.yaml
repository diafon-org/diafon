- {ipa: b, pl: bilabial, mn: plosive, vc: vd}
- {ipa: t, pl: alveolar, mn: plosive, vc: vl, note: "[tʃ] before /i/ — allophone"}
- {ipa: d, pl: alveolar, mn: plosive, vc: vd, note: "[dʒ] before /i/ — allophone"}
- {ipa: k, pl: velar, mn: plosive, vc: vl}
- {ipa: g, pl: velar, mn: plosive, vc: vd}
