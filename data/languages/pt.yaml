# Portuguese [PT] — Brazilian. Five nasal vowels are phonemic; [tʃ dʒ] before /i/ and [ɐ] in
# unstressed position are ALLOPHONES, not entries. ʎ ɲ are the palatalized coronals; ʁ folds to ɣ.
name: Portuguese
family: Indo-European
