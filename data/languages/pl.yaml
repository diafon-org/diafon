# Polish [PL] — CANDIDATE, dry-run only. The three-way sibilant series is the point of the test:
# s/z (dental) ~ sz/ż [ʂ ʐ] (retroflex) ~ ś/ź [ɕ ʑ] (alveolo-palatal) all contrast, e.g.
# kasa [kasa] ~ kasza [kaʂa] ~ Kasia [kaɕa] is a minimal TRIPLE. The soft series ś ź ć dź is entered
# as the coronals + palatalized, exactly as Russian сь зь and Ukrainian ць are — the same call the
# palatal-coronal merge makes: palatal PLACE vs palatalized coronal is phonetic, and not encoded here.
name: Polish
family: Indo-European
consonants:
- {ipa: p, pl: bilabial, mn: plosive, vc: vl}
- {ipa: b, pl: bilabial, mn: plosive, vc: vd}
- {ipa: t, pl: dental, mn: plosive, vc: vl}
- {ipa: d, pl: dental, mn: plosive, vc: vd}
- {ipa: k, pl: velar, mn: plosive, vc: vl}
- {ipa: g, pl: velar, mn: plosive, vc: vd}
- {ipa: ts, pl: alveolar, mn: affricate, vc: vl, orth: c}
- {ipa: dz, pl: alveolar, mn: affricate, vc: vd, orth: dz}
- {ipa: tʂ, pl: postalveolar, mn: affricate, vc: vl, mod: [retroflex], orth: cz}
- {ipa: dʐ, pl: postalveolar, mn: affricate, vc: vd, mod: [retroflex], orth: dż}
- {ipa: tɕ, pl: alveolopalatal, mn: affricate, vc: vl, orth: ć}
- {ipa: dʑ, pl: alveolopalatal, mn: affricate, vc: vd, orth: dź}
- {ipa: f, pl: labiodental, mn: fricative, vc: vl}
- {ipa: v, pl: labiodental, mn: fricative, vc: vd}
- {ipa: s, pl: alveolar, mn: fricative, vc: vl}
- {ipa: z, pl: alveolar, mn: fricative, vc: vd}
- {ipa: ʂ, pl: postalveolar, mn: fricative, vc: vl, mod: [retroflex], orth: sz}
- {ipa: ʐ, pl: postalveolar, mn: fricative, vc: vd, mod: [retroflex], orth: ż/rz}
- {ipa: ɕ, pl: alveolopalatal, mn: fricative, vc: vl, orth: ś, note: "kasa ~ kasza ~ Kasia"}
- {ipa: ʑ, pl: alveolopalatal, mn: fricative, vc: vd, orth: ź}
- {ipa: x, pl: velar, mn: fricative, vc: vl, orth: ch/h}
- {ipa: m, pl: bilabial, mn: nasal, vc: vd}
- {ipa: n, pl: alveolar, mn: nasal, vc: vd}
- {ipa: ɲ, pl: alveolar, mn: nasal, vc: vd, mod: [palatalized], orth: ń}
- {ipa: l, pl: alveolar, mn: lateral-approximant, vc: vd}
- {ipa: r, pl: alveolar, mn: trill, vc: vd}
vowels:
- {ipa: i, hi: close, bk: front, rd: false, orth: i}
- {ipa: ɨ, hi: close, bk: central, rd: false, orth: y}
- {ipa: ɛ, hi: open-mid, bk: front, rd: false, orth: e}
- {ipa: a, hi: open, bk: central, rd: false, orth: a}
- {ipa: ɔ, hi: open-mid, bk: back, rd: true, orth: o}
- {ipa: u, hi: close, bk: back, rd: true, orth: u/ó}
# glides = nonsyllabic close vowels; ł is /w/
- {ipa: j, hi: close, bk: front, rd: false, mod: [nonsyllabic], orth: j}
- {ipa: w, hi: close, bk: back, rd: true, mod: [nonsyllabic], orth: ł}
nasal_series: [ɛ, ɔ]
