# Arabic (Modern Standard)  [AR]
name: Arabic (Modern Standard)
family: Semitic
consonants:
- {ipa: b, pl: bilabial, mn: plosive, vc: vd}
- {ipa: t, pl: alveolar, mn: plosive, vc: vl}
- {ipa: d, pl: alveolar, mn: plosive, vc: vd}
- {ipa: k, pl: velar, mn: plosive, vc: vl}
- {ipa: q, pl: uvular, mn: plosive, vc: vl, orth: ق}
- {ipa: ʔ, pl: glottal, mn: plosive, vc: vl, orth: ء}
- {ipa: dʒ, pl: postalveolar, mn: affricate, vc: vd, orth: ج}
- {ipa: f, pl: labiodental, mn: fricative, vc: vl}
- {ipa: θ, pl: alveolar, mn: plosive, vc: vl, mod: [exotic], orth: ث}
- {ipa: ð, pl: alveolar, mn: plosive, vc: vd, mod: [exotic], orth: ذ}
- {ipa: s, pl: alveolar, mn: fricative, vc: vl}
- {ipa: z, pl: alveolar, mn: fricative, vc: vd}
- {ipa: ʃ, pl: postalveolar, mn: fricative, vc: vl, orth: ش}
- {ipa: x, pl: velar, mn: fricative, vc: vl, orth: خ}
- {ipa: ʁ, pl: uvular, mn: fricative, vc: vd, orth: غ}
# The pharyngeals ride the k/g EXOTIC slots (Sz): ħ = ky, ʕ = gy — symmetric with خ غ on kx gx,
# the exotic as the guttural one step beyond x. No pharyngeal points exist; AR has no aspirates
# or ejectives, so ky gy are free within Arabic. (AR has no bare /g/ either — the g base carries
# only غ ɣ and this exotic.)
- {ipa: ħ, pl: velar, mn: plosive, vc: vl, mod: [exotic], orth: ح, note: "voiceless pharyngeal fricative [ħ]"}
- {ipa: ʕ, pl: velar, mn: plosive, vc: vd, mod: [exotic], orth: ع, note: "voiced pharyngeal fricative [ʕ]"}
- {ipa: h, pl: glottal, mn: fricative, vc: vl, orth: ه}
- {ipa: m, pl: bilabial, mn: nasal, vc: vd}
- {ipa: n, pl: alveolar, mn: nasal, vc: vd}
- {ipa: l, pl: alveolar, mn: lateral-approximant, vc: vd}
- {ipa: r, pl: alveolar, mn: trill, vc: vd}
vowels:
- {ipa: a, hi: open, bk: central, rd: false}
- {ipa: i, hi: close, bk: front, rd: false}
- {ipa: u, hi: close, bk: back, rd: true}
# glides = nonsyllabic close vowels (labels ix/ux/icx via the x=reduce modifier)
- {ipa: j, hi: close, bk: front, rd: false, mod: [nonsyllabic], orth: ي, note: yāʾ — a root consonant}
- {ipa: w, hi: close, bk: back, rd: true, mod: [nonsyllabic], orth: و, note: wāw — a root consonant}
long_series: [a, i, u]
secondary_series:
- type: pharyngealized
  applies_to: [t, d, s, z]   # ظ modelled as zˤ (its usual spoken value), so the label is zy not dxy
