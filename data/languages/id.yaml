# Indonesian (Standard)  [ID]
# Coverage language — inventory is a subset of the existing points (a "free" addition).
# Excluded as allophonic: final unreleased stops; [ʔ] between like vowels where predictable.
name: Indonesian
family: Austronesian
consonants:
- {ipa: p, pl: bilabial, mn: plosive, vc: vl}
- {ipa: b, pl: bilabial, mn: plosive, vc: vd}
- {ipa: t, pl: alveolar, mn: plosive, vc: vl}
- {ipa: d, pl: alveolar, mn: plosive, vc: vd}
- {ipa: k, pl: velar, mn: plosive, vc: vl}
- {ipa: g, pl: velar, mn: plosive, vc: vd}
- {ipa: ʔ, pl: glottal, mn: plosive, vc: vl, st: marginal, orth: k/', note: final -k, bab-ab boundaries}
- {ipa: tʃ, pl: postalveolar, mn: affricate, vc: vl, orth: c}
- {ipa: dʒ, pl: postalveolar, mn: affricate, vc: vd, orth: j}
- {ipa: m, pl: bilabial, mn: nasal, vc: vd}
- {ipa: n, pl: alveolar, mn: nasal, vc: vd}
- {ipa: ɲ, pl: alveolar, mn: nasal, vc: vd, mod: [palatalized], orth: ny}
- {ipa: ŋ, pl: alveolar, mn: nasal, vc: vd, mod: [exotic], orth: ng}
- {ipa: f, pl: labiodental, mn: fricative, vc: vl, st: loan}
- {ipa: z, pl: alveolar, mn: fricative, vc: vd, st: loan}
- {ipa: s, pl: alveolar, mn: fricative, vc: vl}
- {ipa: ʃ, pl: postalveolar, mn: fricative, vc: vl, st: loan, orth: sy}
- {ipa: h, pl: glottal, mn: fricative, vc: vl}
- {ipa: l, pl: alveolar, mn: lateral-approximant, vc: vd}
- {ipa: r, pl: alveolar, mn: trill, vc: vd}
vowels:
- {ipa: i, hi: close, bk: front, rd: false}
- {ipa: e, hi: close-mid, bk: front, rd: false}
- {ipa: ə, hi: mid, bk: central, rd: false}
- {ipa: a, hi: open, bk: central, rd: false}
- {ipa: o, hi: close-mid, bk: back, rd: true}
- {ipa: u, hi: close, bk: back, rd: true}
# glides = nonsyllabic close vowels
- {ipa: j, hi: close, bk: front, rd: false, mod: [nonsyllabic], orth: y, note: ya, ayam}
- {ipa: w, hi: close, bk: back, rd: true, mod: [nonsyllabic], orth: w, note: waktu}
