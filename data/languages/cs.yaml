# Czech [CS] — the fricative-trill witness. ř /r̝/ is a trill and a non-sibilant fricative pronounced
# SIMULTANEOUSLY (it sounds like [r] and [ʒ] at once), and Czech contrasts it against both of those
# and against their sequences: ržát [rʒaːt] 'to neigh' ~ žrát [ʒraːt] 'to eat' ~ řád [r̝aːt] 'order'.
# Voiceless [r̝̊] is an ALLOPHONE (before/after a voiceless consonant, and word-finally), not a phoneme.
# ⟨h⟩ is [ɦ] but Czech has no voiceless [h] to contrast it with, so it is the plain /h/ point.
name: Czech
family: Indo-European
consonants:
- {ipa: p, pl: bilabial, mn: plosive, vc: vl}
- {ipa: b, pl: bilabial, mn: plosive, vc: vd}
- {ipa: t, pl: alveolar, mn: plosive, vc: vl}
- {ipa: d, pl: alveolar, mn: plosive, vc: vd}
- {ipa: c, pl: alveolar, mn: plosive, vc: vl, mod: [palatalized], orth: ť}
- {ipa: ɟ, pl: alveolar, mn: plosive, vc: vd, mod: [palatalized], orth: ď}
- {ipa: k, pl: velar, mn: plosive, vc: vl}
- {ipa: g, pl: velar, mn: plosive, vc: vd, st: marginal, note: mostly loans}
- {ipa: ts, pl: alveolar, mn: affricate, vc: vl, orth: c}
- {ipa: dz, pl: alveolar, mn: affricate, vc: vd, st: marginal, orth: dz}
- {ipa: tʃ, pl: postalveolar, mn: affricate, vc: vl, orth: č}
- {ipa: dʒ, pl: postalveolar, mn: affricate, vc: vd, st: marginal, orth: dž}
- {ipa: f, pl: labiodental, mn: fricative, vc: vl}
- {ipa: v, pl: labiodental, mn: fricative, vc: vd}
- {ipa: s, pl: alveolar, mn: fricative, vc: vl}
- {ipa: z, pl: alveolar, mn: fricative, vc: vd}
- {ipa: ʃ, pl: postalveolar, mn: fricative, vc: vl, orth: š}
- {ipa: ʒ, pl: postalveolar, mn: fricative, vc: vd, orth: ž}
- {ipa: x, pl: velar, mn: fricative, vc: vl, orth: ch}
- {ipa: h, pl: glottal, mn: fricative, vc: vl, orth: h, note: "realised [ɦ]; no voiceless [h] contrasts with it"}
- {ipa: m, pl: bilabial, mn: nasal, vc: vd}
- {ipa: n, pl: alveolar, mn: nasal, vc: vd}
- {ipa: ɲ, pl: alveolar, mn: nasal, vc: vd, mod: [palatalized], orth: ň}
- {ipa: l, pl: alveolar, mn: lateral-approximant, vc: vd, note: "syllabic [l̩] is prosodic — vlk"}
- {ipa: r, pl: alveolar, mn: trill, vc: vd, note: "syllabic [r̩] is prosodic — krk"}
- {ipa: "r̝", pl: alveolar, mn: trill, vc: vd, mod: [palatalized], orth: ř,
   note: "[r̝] — a trill and a non-sibilant fricative at once, NOT palatalized. It takes the
     palatalized slot because Czech has no soft r and no language contrasts [r̝] with [rʲ], so
     `rj` reads as THE MODIFIED R — the same reuse as Korean fortis on `long`. řád ~ rád, and
     against the sequences: žrát [ʒraːt] ~ ržát [rʒaːt]."}
vowels:
- {ipa: i, hi: close, bk: front, rd: false, orth: i/í, note: "short is [ɪ]"}
- {ipa: ɛ, hi: open-mid, bk: front, rd: false, orth: e/é}
- {ipa: a, hi: open, bk: central, rd: false, orth: a/á}
- {ipa: o, hi: close-mid, bk: back, rd: true, orth: o/ó}
- {ipa: u, hi: close, bk: back, rd: true, orth: u/ú/ů}
# glide = nonsyllabic close vowel; the diphthongs ou au eu are V + glide sequences
- {ipa: j, hi: close, bk: front, rd: false, mod: [nonsyllabic], orth: j}
long_series: [i, ɛ, a, o, u]
