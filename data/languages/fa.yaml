# Persian (Iranian, Tehrani)  [FA]
# Coverage language — "free": æ folds to the a point, ɒ folds to ɑ (the ɒ→ɑ ledger entry;
# FA has no plain ɑ, so the fold is safe). غ/ق are merged in Iranian Persian — entered once
# as the uvular stop (kq).
name: Persian
family: Iranian
consonants:
- {ipa: p, pl: bilabial, mn: plosive, vc: vl}
- {ipa: b, pl: bilabial, mn: plosive, vc: vd}
- {ipa: t, pl: alveolar, mn: plosive, vc: vl}
- {ipa: d, pl: alveolar, mn: plosive, vc: vd}
- {ipa: k, pl: velar, mn: plosive, vc: vl}
- {ipa: g, pl: velar, mn: plosive, vc: vd}
- {ipa: q, pl: uvular, mn: plosive, vc: vl, orth: ق/غ, note: merged ɢ~ɣ realisations}
- {ipa: ʔ, pl: glottal, mn: plosive, vc: vl, orth: ء/ع}
- {ipa: tʃ, pl: postalveolar, mn: affricate, vc: vl, orth: چ}
- {ipa: dʒ, pl: postalveolar, mn: affricate, vc: vd, orth: ج}
- {ipa: m, pl: bilabial, mn: nasal, vc: vd}
- {ipa: n, pl: alveolar, mn: nasal, vc: vd}
- {ipa: f, pl: labiodental, mn: fricative, vc: vl}
- {ipa: v, pl: labiodental, mn: fricative, vc: vd}
- {ipa: s, pl: alveolar, mn: fricative, vc: vl}
- {ipa: z, pl: alveolar, mn: fricative, vc: vd}
- {ipa: ʃ, pl: postalveolar, mn: fricative, vc: vl, orth: ش}
