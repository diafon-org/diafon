- {ipa: x, pl: velar, mn: fricative, vc: vl, orth: ח/כ, note: phonetically χ for many speakers}
- {ipa: ʁ, pl: uvular, mn: fricative, vc: vd, orth: ר, note: folds to ɣ (gx) — HE has no ɣ}
