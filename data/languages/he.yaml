# Modern Hebrew (Israeli)  [HE]
# Coverage language — "free": ʁ folds into ɣ via the uvular→velar ledger entry (HE has no ɣ).
# Excluded: pharyngeals ħ ʕ (merged into x and ʔ/zero in mainstream Israeli speech).
name: Modern Hebrew
family: Semitic
consonants:
- {ipa: p, pl: bilabial, mn: plosive, vc: vl}
- {ipa: b, pl: bilabial, mn: plosive, vc: vd}
- {ipa: t, pl: alveolar, mn: plosive, vc: vl}
- {ipa: d, pl: alveolar, mn: plosive, vc: vd}
- {ipa: k, pl: velar, mn: plosive, vc: vl}
- {ipa: g, pl: velar, mn: plosive, vc: vd}
- {ipa: ʔ, pl: glottal, mn: plosive, vc: vl, orth: א/ע, note: often elided; contrastive carefully}
- {ipa: ts, pl: alveolar, mn: affricate, vc: vl, orth: צ}
- {ipa: tʃ, pl: postalveolar, mn: affricate, vc: vl, st: loan, orth: צ׳}
- {ipa: dʒ, pl: postalveolar, mn: affricate, vc: vd, st: loan, orth: ג׳}
- {ipa: m, pl: bilabial, mn: nasal, vc: vd}
- {ipa: n, pl: alveolar, mn: nasal, vc: vd}
