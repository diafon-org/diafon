# French  [FR]
name: French
family: Romance
consonants:
- {ipa: p, pl: bilabial, mn: plosive, vc: vl}
- {ipa: b, pl: bilabial, mn: plosive, vc: vd}
- {ipa: t, pl: alveolar, mn: plosive, vc: vl}
- {ipa: d, pl: alveolar, mn: plosive, vc: vd}
- {ipa: k, pl: velar, mn: plosive, vc: vl}
- {ipa: g, pl: velar, mn: plosive, vc: vd}
- {ipa: f, pl: labiodental, mn: fricative, vc: vl}
- {ipa: v, pl: labiodental, mn: fricative, vc: vd}
- {ipa: s, pl: alveolar, mn: fricative, vc: vl}
- {ipa: z, pl: alveolar, mn: fricative, vc: vd}
- {ipa: ʃ, pl: postalveolar, mn: fricative, vc: vl}
- {ipa: ʒ, pl: postalveolar, mn: fricative, vc: vd}
- {ipa: ʁ, pl: uvular, mn: fricative, vc: vd, orth: r}
- {ipa: m, pl: bilabial, mn: nasal, vc: vd}
- {ipa: n, pl: alveolar, mn: nasal, vc: vd}
- {ipa: ɲ, pl: palatal, mn: nasal, vc: vd, orth: gn}
- {ipa: l, pl: alveolar, mn: lateral-approximant, vc: vd}
# glides /j/ /w/ /ɥ/ removed — non-syllabic /i/ /u/ /y/, not consonant points
vowels:
- {ipa: i, hi: close, bk: front, rd: false}
- {ipa: y, hi: close, bk: front, rd: true}
- {ipa: u, hi: close, bk: back, rd: true}
- {ipa: e, hi: close-mid, bk: front, rd: false}
- {ipa: ø, hi: close-mid, bk: front, rd: true}
- {ipa: o, hi: close-mid, bk: back, rd: true}
- {ipa: ɛ, hi: open-mid, bk: front, rd: false}
- {ipa: œ, hi: open-mid, bk: front, rd: true}
- {ipa: ɔ, hi: open-mid, bk: back, rd: true}
- {ipa: a, hi: open, bk: central, rd: false}
- {ipa: ɑ, hi: open, bk: back, rd: false, st: marginal}
- {ipa: ə, hi: mid, bk: central, rd: false}
nasal_series: [e, a, o]   # ẽ ã õ — the French nasals as nasalised cardinals (simplified base).
                          # œ̃ dropped: brin~brun is merging into ɛ̃ across modern French, so we model
                          # the 3-way system (bon=õ, banc=ã, brin=ẽ). Re-add œ for conservative French.
