# Igbo; phoneme metadata only (IPA inventory, coarse frequency,
# speakers). No point mapping. freq: L frequent · M ordinary ·
# S infrequent · X marginal/loan. See data/README.md.
# Standard Igbo (Igbo izugbe), after the Ọnwụ alphabet's values (Wikipedia:
# Igbo language, Igbo alphabet; the vowels after Ikekeonwu 1999). Two vowel
# sets in harmony: i e o u and ɪ a ɔ ʊ; no vowel length. The nasal vowels
# and the Central dialects' extra series are left out. Downstep, the third
# tone, has no sign yet: high and low only.
