# Korean (Seoul Standard)  [KO]
# Added as a major language. Its three-way laryngeal obstruent series —
# plain /p t k tɕ s/ ~ aspirated /pʰ tʰ kʰ tɕʰ/ ~ TENSE(fortis) /p͈ t͈ k͈ t͈ɕ s͈/ — is
# modelled WITHOUT a new modifier: the tense/fortis series reuses the `long` modifier.
# Rationale (Sz's "weird pairings" test): fortis and length never contrast — Seoul Korean
# has no phonemic vowel length or geminates, so `long` is free to carry fortis. But
# aspiration keeps its OWN modifier, because Korean DOES contrast fortis vs aspirated
# (/t͈/ ~ /tʰ/). So: fortis ≈ long, but fortis ≠ aspiration.
# Liquid is one phoneme /l/ ([ɾ] intervocalically). ㅚ/ㅟ (ø/y) are marginal monophthongs.
name: Korean (Seoul Standard)
family: Koreanic
consonants:
- {ipa: p, pl: bilabial, mn: plosive, vc: vl}
- {ipa: t, pl: alveolar, mn: plosive, vc: vl}
- {ipa: k, pl: velar, mn: plosive, vc: vl}
- {ipa: tɕ, pl: alveolopalatal, mn: affricate, vc: vl, orth: ㅈ}
- {ipa: p͈, pl: bilabial, mn: plosive, vc: vl, mod: [long], orth: ㅃ, note: tense/fortis}
- {ipa: t͈, pl: alveolar, mn: plosive, vc: vl, mod: [long], orth: ㄸ, note: tense/fortis}
- {ipa: k͈, pl: velar, mn: plosive, vc: vl, mod: [long], orth: ㄲ, note: tense/fortis}
- {ipa: t͈ɕ, pl: alveolopalatal, mn: affricate, vc: vl, mod: [long], orth: ㅉ, note: tense/fortis}
- {ipa: s, pl: alveolar, mn: fricative, vc: vl}
- {ipa: s͈, pl: alveolar, mn: fricative, vc: vl, mod: [long], orth: ㅆ, note: tense/fortis}
- {ipa: h, pl: glottal, mn: fricative, vc: vl}
- {ipa: m, pl: bilabial, mn: nasal, vc: vd}
- {ipa: n, pl: alveolar, mn: nasal, vc: vd}
- {ipa: ŋ, pl: alveolar, mn: nasal, vc: vd, mod: [exotic], note: coda only}
- {ipa: l, pl: alveolar, mn: lateral-approximant, vc: vd, note: '[ɾ] intervocalic'}
secondary_series:
- type: aspirated
  applies_to: [p, t, k, tɕ]
vowels:
- {ipa: i, hi: close, bk: front, rd: false}
- {ipa: e, hi: close-mid, bk: front, rd: false}
- {ipa: ɛ, hi: open-mid, bk: front, rd: false}
- {ipa: ø, hi: close-mid, bk: front, rd: true, st: marginal, note: 'often diphthongised [we]'}
- {ipa: y, hi: close, bk: front, rd: true, st: marginal, note: 'often diphthongised [wi]'}
- {ipa: ɯ, hi: close, bk: back, rd: false}
- {ipa: ʌ, hi: open-mid, bk: back, rd: false, orth: ㅓ}
- {ipa: o, hi: close-mid, bk: back, rd: true}
- {ipa: u, hi: close, bk: back, rd: true}
- {ipa: a, hi: open, bk: central, rd: false}
# glides = nonsyllabic close vowels (labels ix/ux/icx via the x=reduce modifier)
- {ipa: j, hi: close, bk: front, rd: false, mod: [nonsyllabic], orth: ㅑ-series, note: on-glide}
- {ipa: w, hi: close, bk: back, rd: true, mod: [nonsyllabic], orth: ㅘ-series, note: on-glide}
