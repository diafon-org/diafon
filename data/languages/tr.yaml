# Turkish (Standard Istanbul)  [TR]
# Added as a witness language: contrasts /u/~/ɯ/ (kul "servant" ~ kıl "hair"),
# /y/~/u/, /ø/~/o/ — locking the high/mid back rounded~unrounded points that the
# core 12 only had as non-co-occurring near-merges.
# Excluded as allophonic/non-phonemic: [c ɟ] (palatal allophones of k/g before
# front vowels), [ŋ] (before velars), [ɫ] (velarised l), ğ /ɣ/ (yumuşak g — no
# longer a consonant in standard speech; lengthens the preceding vowel).
name: Turkish (Standard Istanbul)
family: Turkic
consonants:
- {ipa: p, pl: bilabial, mn: plosive, vc: vl}
- {ipa: b, pl: bilabial, mn: plosive, vc: vd}
- {ipa: t, pl: alveolar, mn: plosive, vc: vl}
- {ipa: d, pl: alveolar, mn: plosive, vc: vd}
- {ipa: k, pl: velar, mn: plosive, vc: vl}
- {ipa: g, pl: velar, mn: plosive, vc: vd}
- {ipa: tʃ, pl: postalveolar, mn: affricate, vc: vl, orth: ç}
- {ipa: dʒ, pl: postalveolar, mn: affricate, vc: vd, orth: c}
- {ipa: f, pl: labiodental, mn: fricative, vc: vl}
- {ipa: v, pl: labiodental, mn: fricative, vc: vd}
- {ipa: s, pl: alveolar, mn: fricative, vc: vl}
- {ipa: z, pl: alveolar, mn: fricative, vc: vd}
- {ipa: ʃ, pl: postalveolar, mn: fricative, vc: vl, orth: ş}
- {ipa: ʒ, pl: postalveolar, mn: fricative, vc: vd, orth: j}
- {ipa: h, pl: glottal, mn: fricative, vc: vl}
- {ipa: m, pl: bilabial, mn: nasal, vc: vd}
- {ipa: n, pl: alveolar, mn: nasal, vc: vd}
- {ipa: l, pl: alveolar, mn: lateral-approximant, vc: vd}
- {ipa: ɾ, pl: alveolar, mn: tap, vc: vd, orth: r}
vowels:
- {ipa: i, hi: close, bk: front, rd: false}
- {ipa: y, hi: close, bk: front, rd: true, orth: ü}
- {ipa: ɯ, hi: close, bk: back, rd: false, orth: ı}
- {ipa: u, hi: close, bk: back, rd: true}
- {ipa: e, hi: close-mid, bk: front, rd: false}
- {ipa: ø, hi: close-mid, bk: front, rd: true, orth: ö}
- {ipa: o, hi: close-mid, bk: back, rd: true}
- {ipa: a, hi: open, bk: central, rd: false}
# glides = nonsyllabic close vowels (labels ix/ux/icx via the x=reduce modifier)
- {ipa: j, hi: close, bk: front, rd: false, mod: [nonsyllabic], orth: y, note: yıl/ay}
