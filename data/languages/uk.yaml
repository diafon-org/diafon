# Ukrainian (Standard)  [UK]
# Coverage language — near-free: г is entered as the velar voiced fricative ɣ (gx) with the
# note that it is phonetically glottal/pharyngeal ɦ (UK has no other ɣ, so the reading is safe —
# same spirit as the R slot). Soft series via the palatalized secondary series.
name: Ukrainian
family: Slavic
stress: true
consonants:
- {ipa: p, pl: bilabial, mn: plosive, vc: vl}
- {ipa: b, pl: bilabial, mn: plosive, vc: vd}
- {ipa: t, pl: alveolar, mn: plosive, vc: vl}
- {ipa: d, pl: alveolar, mn: plosive, vc: vd}
- {ipa: k, pl: velar, mn: plosive, vc: vl}
- {ipa: g, pl: velar, mn: plosive, vc: vd, st: marginal, orth: ґ}
- {ipa: ts, pl: alveolar, mn: affricate, vc: vl, orth: ц}
- {ipa: dz, pl: alveolar, mn: affricate, vc: vd, orth: дз, st: marginal}
- {ipa: tʃ, pl: postalveolar, mn: affricate, vc: vl, orth: ч}
- {ipa: dʒ, pl: postalveolar, mn: affricate, vc: vd, orth: дж, st: marginal}
- {ipa: m, pl: bilabial, mn: nasal, vc: vd}
- {ipa: n, pl: alveolar, mn: nasal, vc: vd}
- {ipa: f, pl: labiodental, mn: fricative, vc: vl, st: loan}
- {ipa: v, pl: labiodental, mn: fricative, vc: vd, note: 'often [ʋ~w] positionally'}
- {ipa: s, pl: alveolar, mn: fricative, vc: vl}
- {ipa: z, pl: alveolar, mn: fricative, vc: vd}
- {ipa: ʃ, pl: postalveolar, mn: fricative, vc: vl, orth: ш}
- {ipa: ʒ, pl: postalveolar, mn: fricative, vc: vd, orth: ж}
- {ipa: x, pl: velar, mn: fricative, vc: vl, orth: х}
- {ipa: ɣ, pl: velar, mn: fricative, vc: vd, orth: г, note: phonetically ɦ — no ɣ~ɦ contrast}
- {ipa: l, pl: alveolar, mn: lateral-approximant, vc: vd}
- {ipa: r, pl: alveolar, mn: trill, vc: vd}
secondary_series:
- {type: palatalized, applies_to: [t, d, s, z, ts, n, l, r]}
vowels:
- {ipa: i, hi: close, bk: front, rd: false, orth: і}
- {ipa: ɪ, hi: near-close, bk: front, rd: false, orth: и}
- {ipa: ɛ, hi: open-mid, bk: front, rd: false, orth: е}
- {ipa: a, hi: open, bk: central, rd: false, orth: а}
- {ipa: ɔ, hi: open-mid, bk: back, rd: true, orth: о}
- {ipa: u, hi: close, bk: back, rd: true, orth: у}
# glides
- {ipa: j, hi: close, bk: front, rd: false, mod: [nonsyllabic], orth: й, note: мій~мої}
