# Georgian [KA] — the ejective test, absorbed by the exotic ladder. Three-way stops
# voiced / aspirated / EJECTIVE: the aspirated series is the BARE voiceless point (exactly as
# English p t k, which are [pʰ tʰ kʰ]), and the ejective is the language's exotic: tʼ = `ty`.
# No language pairs an ejective with θ/tʰ/pf on one base, so the slots never clash. The uvular
# is ejective-only [qʼ] with no plain q to contrast — so it is the BARE kq point (slot principle).
name: Georgian
family: Kartvelian
consonants:
- {ipa: p, pl: bilabial, mn: plosive, vc: vl, orth: ფ, note: "aspirated [pʰ] — the bare point, as in English"}
- {ipa: pʼ, pl: bilabial, mn: plosive, vc: vl, mod: [ejective], orth: პ}
- {ipa: b, pl: bilabial, mn: plosive, vc: vd, orth: ბ}
- {ipa: t, pl: alveolar, mn: plosive, vc: vl, orth: თ, note: "aspirated [tʰ]"}
- {ipa: tʼ, pl: alveolar, mn: plosive, vc: vl, mod: [ejective], orth: ტ}
- {ipa: d, pl: alveolar, mn: plosive, vc: vd, orth: დ}
- {ipa: k, pl: velar, mn: plosive, vc: vl, orth: ქ, note: "aspirated [kʰ]"}
- {ipa: kʼ, pl: velar, mn: plosive, vc: vl, mod: [ejective], orth: კ}
- {ipa: g, pl: velar, mn: plosive, vc: vd, orth: გ}
- {ipa: qʼ, pl: uvular, mn: plosive, vc: vl, orth: ყ, note: "ejective [qʼ] — no plain q, so the bare uvular point"}
- {ipa: ts, pl: alveolar, mn: affricate, vc: vl, orth: ც, note: "aspirated [tsʰ]"}
- {ipa: tsʼ, pl: alveolar, mn: affricate, vc: vl, mod: [ejective], orth: წ}
- {ipa: dz, pl: alveolar, mn: affricate, vc: vd, orth: ძ}
- {ipa: tʃ, pl: postalveolar, mn: affricate, vc: vl, orth: ჩ, note: "aspirated [tʃʰ]"}
- {ipa: tʃʼ, pl: postalveolar, mn: affricate, vc: vl, mod: [ejective], orth: ჭ}
- {ipa: dʒ, pl: postalveolar, mn: affricate, vc: vd, orth: ჯ}
- {ipa: f, pl: labiodental, mn: fricative, vc: vl, st: loan, note: "loans only"}
- {ipa: v, pl: labiodental, mn: fricative, vc: vd, orth: ვ}
- {ipa: s, pl: alveolar, mn: fricative, vc: vl, orth: ს}
- {ipa: z, pl: alveolar, mn: fricative, vc: vd, orth: ზ}
- {ipa: ʃ, pl: postalveolar, mn: fricative, vc: vl, orth: შ}
- {ipa: ʒ, pl: postalveolar, mn: fricative, vc: vd, orth: ჟ}
- {ipa: x, pl: velar, mn: fricative, vc: vl, orth: ხ, note: "often uvular [χ] — one phoneme"}
- {ipa: ɣ, pl: velar, mn: fricative, vc: vd, orth: ღ, note: "often [ʁ]"}
- {ipa: h, pl: glottal, mn: fricative, vc: vl, orth: ჰ}
- {ipa: m, pl: bilabial, mn: nasal, vc: vd, orth: მ}
- {ipa: n, pl: alveolar, mn: nasal, vc: vd, orth: ნ}
- {ipa: l, pl: alveolar, mn: lateral-approximant, vc: vd, orth: ლ}
