# Swahili spelling stage: the point stream rendered in today's Swahili
# orthography. Render-only, like every stage.
#
# Swahili is written as it sounds; the digraphs are its own. Losses, one-way
# and stated: the velar nasal before g is written n in Swahili (ngoma), here
# always ng'.
# A doubled nasal (mmoja, nne) is a syllabic nasal before its own letter: the
# script marks the first one (m̈moja, n̈ne), the spelling writes mm, nn.
code: sw
name: Swahili
state: draft
letters: a b ch d dh e f g gh h i j k kh l m n ng' ny o p r s sh t th u v w y z
long: double
pairs: {m̈m: mm, n̈n: nn}      # mmoja, nne: a syllabic nasal and the consonant after it, never a long one
sample: habari za asubuhi, karibu sana      # habari za asubuhi, karibu sana
read:                   # read back but never written: the loan letters
  x: ks
  q: kv
points:
  p: p
  b: b
  t: t
  d: d
  k: k
  g: g
  f: f
  v: v
  s: s
  z: z
  ʃ: sh
  tʃ: ch
  ɟ: j
  θ: th
  ð: dh
  x: kh
  ɣ: gh
  ɲ: ny
  ŋ: ng'
  h: h
  m: m
  n: n
  l: l
  r: r
  j: y
  w: w
  a: a
  e: e
  i: i
  o: o
  u: u
