# Swahili spelling stage: the point stream rendered in today's Swahili
# orthography. Render-only, like every stage.
#
# Swahili is written as it sounds; the digraphs are its own. Losses, one-way
# and stated: the velar nasal before g is written n in Swahili (ngoma), here
# always ng'.
code: sw
name: Swahili spelling
state: draft
