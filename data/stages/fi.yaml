# Finnish spelling stage: the point stream rendered in today's Finnish
# orthography. Render-only, like every stage.
#
# Finnish is written as it sounds: length doubles the letter, front a is ä.
# Finnish ng is the long /ŋː/ (hengessä), read as ṇṇ. Losses, one-way and
# stated: a single /ŋ/ before k is written n in Finnish (kenkä), here ng.
code: fi
name: Finnish
state: draft
letters: a aa ä ää b d e ee f g h i ii j k l m n ng o oo ö öö p r s š t u uu v y yy
long: double            # a long consonant doubles its letter: tt, kk, ss
sample: hüva̋ üötä ja kaunista kesa̋      # hyvää yötä ja kaunista kesää
read:                   # read back but never written: the loan letters
  x: ks
  w: v
  q: kv
  z: c
points:
  # consonants
  p: p
  b: b
  t: t
  d: d
  k: k
  g: g
  f: f
  v: v
  s: s
  ʃ: š
  h: h
  m: m
  n: n
  ŋ: ng
  ŋː: ng               # ng is long: read back as nxw
  l: l
  r: r
  j: j
  # vowels: the front a is ä, the back a is a; length doubles the letter
  a: a
  aː: aa
  æ: ä
  æː: ää
  e: e
  eː: ee
  ø: ö
  øː: öö
  i: i
  iː: ii
  y: y
  yː: yy
  o: o
  oː: oo
  u: u
  uː: uu
