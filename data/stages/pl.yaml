# Polish spelling stage: the point stream rendered in today's Polish
# orthography. Render-only, like every stage.
#
# Losses, one-way and stated: ż and rz spell the same sound (ż throughout);
# u and ó the same vowel (u throughout); ch and h the same fricative (ch
# throughout); the soft consonants are written with their own letters (ń ś ź
# ć dź) even before a vowel, where Polish writes ni si zi ci dzi.
code: pl
name: Polish spelling
state: draft
letters: a ą b c ć ch cz d dz dź dż e ę f g h i j k l ł m n ń o ó p r s ś sz t u w y z ź ż
long: double
sample: dobra notc, kokxani      # dobra noc, kochani
read:                   # spellings read back but never written: ó and u, rz and ż, h and ch
  x: ks
  q: kv
  v: v
  ó: u
  rz: zjy
  h: kx
forms:
  p: p
  b: b
  t: t
  d: d
