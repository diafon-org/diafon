# Hungarian spelling stage: the point stream rendered in today's Hungarian
# orthography. A stage is render-only: the input stays universal, no
# shortcut ever claims a key, and a text typed for this stage reads
# correctly in the script form and in every other stage too.
#
# Losses are one-way and stated here: ly is etymological (folyó, lyuk), the
# phonemic stream cannot tell it from j, so j is written throughout.
code: hu
name: Hungarian spelling
state: draft            # draft · reviewed · native
letters: a á b c cs d dz dzs e é f g gy h i í j k l ly m n ny o ó ö ő p r s sz t ty u ú ü ű v z zs
long: first-letter      # a long consonant doubles the first letter of its spelling: tt, ssz, ccs, ggy
sample: sjok sewp njawr, hoswuw alma      # sok szép nyár, hosszú alma
read:                   # spellings read back but never written: the etymological ly is j
  x: ks
  w: v
  q: kv
  y: i
  ly: ix
  lly: ixw
forms:
  # consonants
  p: p
  b: b
  t: t
  d: d
  k: k
  g: g
  tj: ty
  dj: gy
  tc: c
  dc: dz
  tq: cs
  dq: dzs
  f: f
  v: v
  s: sz
  z: z
  sj: s
  zj: zs
  h: h
  m: m
  n: n
  nj: ny
  l: l
  r: r
  ix: j
  # vowels; length is its own spelling, so the long forms are listed
  a: a
  aw: á
  e: e
  ew: é
  i: i
  iw: í
  o: o
  ow: ó
  ec: ö
  ecw: ő
  u: u
  uw: ú
  ic: ü
  icw: ű
