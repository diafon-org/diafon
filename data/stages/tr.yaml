# Turkish spelling stage: the point stream rendered in today's Turkish
# orthography. Render-only, like every stage.
#
# Losses, one-way and stated: the soft g (ğ) has no point of its own. It is
# read as the length of the vowel before it (doğa -> dóa) and is not written
# back; long a in loanwords takes the
# circumflex (kâr) so that it stays apart from plain a.
code: tr
name: Turkish
state: draft
letters: a â b c ç d e f g h ı i j k l m n o ö p r s ş t u ü v y z
long: double
sample: güneșli biṛ gün, iji günleṛ      # güneşli bir gün, iyi günler
read:                   # read back but never written: the loan letters
  x: ks
  w: v
  q: kv
  ağ: á                # ğ lengthens the vowel before it
  eğ: é
  ığ: i̋
  iğ: í
  oğ: ó
  öğ: ő
  uğ: ú
  üğ: ű
points:
  p: p
  b: b
  t: t
  d: d
  k: k
  g: g
  f: f
  v: v
  s: s
  z: z
  ʃ: ş
  ʒ: j
  tʃ: ç
  dʒ: c
  h: h
  m: m
  n: n
  l: l
  ɾ: r
  j: y
  a: a
  aː: â
  e: e
  ø: ö
  i: i
  y: ü
  o: o
  u: u
  ɯ: ı
