# Czech spelling stage: the point stream rendered in today's Czech
# orthography. Render-only, like every stage.
#
# Losses, one-way and stated: i and y spell the same vowel (i is written
# throughout, so byl comes out bil); ú and ů spell the same long vowel (ú
# throughout); ě is a spelling of a soft consonant plus e and is not written
# (ť ď ň plus e appear instead: těsto comes out ťesto).
code: cs
name: Czech spelling
state: draft
letters: a á b c č d ď dz dž e é f g h ch i í j k l m n ň o ó p r ř s š t ť u ú v z ž
long: double
sample: dobriw den, prjawtelew      # dobrý den, přátelé
read:                   # spellings read back but never written: etymological y, ů, and ě after d t n m
  x: ks
  w: v
  q: kv
  y: i
  ý: iw
  ů: uw
  dě: dje
  tě: tje
  ně: nje
  mě: mnje
  ě: ixe
