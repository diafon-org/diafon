# Hungarian: the lexical part of the spelling. ly is etymological (folyó,
# lyuk, hely): the letters write j for every /j/, so the stems that take ly
# come from the dictionary (Magyar Ispell, sources/hu_HU.dic, LGPL/GPL/MPL)
# as `write` entries matched by prefix: folyó + k -> folyók. Reading needs no
# list (ly reads as j through the stage's read aliases).
#
# Loans: a word the Hungarian letters cannot read in full (x, w, sh, th, ee,
# oo…) is looked up in the loan lexicons, English then Latin, and is written
# with the sounds of the language it comes from, not as a Hungarian says
# it: meeting -> mítiṇ, like -> lajk. Diafon shows the word itself.
code: hu
name: Hungarian
kind: word
match: prefix
sources:
  - sources/hu_HU.dic        # https://github.com/LibreOffice/dictionaries/tree/master/hu_HU
loans: [la, en]
native: sources/hu_HU.dic   # the stems: a word the dictionary knows is Hungarian, whatever English also has
foreign: "ee|oo|ea|ou|w|x|q|sh|ch|th|ck|ph|(?<![gltn])y"   # letter shapes Hungarian never has: a word the
                             #   dictionary lists with one of these is a loan it keeps in foreign spelling (meeting, team);
                             #   not ai, oa (hazai, jamaicai), nor ay, ey (y after a vowel is already there)
lengthen: {á: a, é: e}       # a stem's final a, e lengthens before a suffix (trauma, traumái): a stem is looked up short too
spoken:                      # Hungarian words spelled the old way and read their own way, neither by the
                             #   letters nor as a loan, matched as a stem; read before everything else
  pech: peh
  cech: céh
  tea: tea                   # team is the loan, tea is not: the shape ea cannot tell them apart
borrowed:                    # loans the Hungarian dictionary lists as its own and no shape betrays: read
                             #   in their own language (se stays Hungarian: neither)
  - online                   # English
  - offline
  - startup
  - email
  - update
  - curriculum               # Latin
  - vitae
  - summa
  - laude
  - priori
  - posteriori
  - facto
  - status
  - quasi
  - circa
  - cetera
  - versa
  - vice
  - ergo
  - mater
  - nota
  - bene
  - situ
  - sic
origin:                      # words no dictionary here reads as their own language says them, given in
                             #   Diafon input: the origin's sounds, one form in every text; matched as a stem
                             #   (jamaicai, Jamaicában)
  jamaica: dqajmeixkaj       # English
  bach: bakx                 # German
  live: laixv                # English, the sense Hungarian borrows (live stream)
  cudjoe: kajdqoux           # English
  ocho: otqo                 # Spanish
