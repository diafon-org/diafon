# Mandarin: the spelling is the syllable. Pinyin syllables (without tone)
# read to transport by rule (initials and finals below, the pinyin
# abbreviations iu ui un and the y/w onsets undone); the tone, a mark or a
# digit 1-4 in pinyin, is the trailing digit of the syllable's last segment;
# the neutral tone carries none. `choices`, generated from Unihan
# (sources/Unihan_Readings.txt, Unicode licence), lists the characters of
# each toned syllable, most frequent first (kHanyuPinlu counts, then the
# 2013 standard list's order), for the input method's chooser.
#
# The phonemic analysis follows the zh table: j q x are z c s before the
# high front vowels (the vowel tells them apart), pinyin o after b p m f is
# uo, e is ɤ (oc), the i of zi ci si zhi chi shi ri is ɨ (uc), ü is y (ic).
