# Mandarin: the spelling is the syllable. Pinyin syllables (without tone)
# read to script text by rule (initials and finals below, the pinyin
# abbreviations iu ui un and the y/w onsets undone); the tone, a mark or a
# digit 1-4 in pinyin, is the trailing digit of the syllable's last segment;
# the neutral tone carries none. `choices`, generated from Unihan
# (sources/Unihan_Readings.txt, Unicode licence), lists the characters of
# each toned syllable, most frequent first (kHanyuPinlu counts, then the
# 2013 standard list's order), for the input method's chooser.
#
# The analysis follows the zh table: j q x are the soft series on the dot (c̣ c̣h ṣ), zh ch sh
# the hush on the anchor (c̦ c̦h ș), as in Polish; pinyin o after b p m f is
# uo (written uo, as it sounds), e is ɤ (ë), the i of zi ci si zhi chi shi ri is ɨ (ï), ü is y (ü).
code: zh
name: Mandarin
kind: syllable
match: word
sources:
  - sources/Unihan_Readings.txt    # https://www.unicode.org/Public/UCD/latest/ucd/Unihan.zip
initials:
  b: p
  p: ph
  m: m
  f: f
  d: t
  t: th
  n: n
  l: l
  g: k
  k: kh
  h: ḳ
  j: c̣                 # the alveolo-palatals take the dot, the soft series as in Polish (ć ś);
  q: c̣h                #   zh ch sh are the hush on the anchor
  x: ṣ
  zh: c̦
  ch: c̦h
  sh: ș
  r: z̦
  z: c
  c: ch
  s: s
finals:                 # pinyin final -> script text; i after z c s zh ch sh r becomes ï; the mid vowel /ə/
                        #   is written as it sounds: o after u (uo, and o after b p m f: [uo]), e o in the
                        #   diphthongs ei ou (as eɪ oʊ everywhere), e after i ü, ë alone and before n ŋ
  a: a
  o: uo
  e: ë
  i: i
  u: u
  ü: ü
  ai: aj
  ei: ej
  ao: aw
  ou: ow
  an: an
  en: ën
  ang: aṇ
  eng: ëṇ
  ong: uṇ
  er: r̈
  ia: ia
  ie: ie
  iao: iaw
  iu: iow
  iou: iow
  io: io
  ian: ien
  in: in
  iang: iaṇ
  ing: iṇ
  iong: iuṇ
  ua: ua
  uo: uo
  uai: uaj
  ui: uej
  uei: uej
  uan: uan
  un: uën
  uen: uën
  uang: uaṇ
  ueng: uëṇ
  üe: üe
  üan: üen
  ün: ün
sample_text: ni3 hao3, shi4 jie4       # 你好，世界
apical: [z, c, s, zh, ch, sh, r]     # their i is ɨ:
apical_vowel: ï
palatal: [j, q, x]                   # their u is ü
