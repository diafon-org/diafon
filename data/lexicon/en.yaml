# English: a lexical spelling. English letters carry no reading of their own,
# so both directions go through the pronunciation dictionary (CMUdict, BSD
# licence, sources/cmudict.dict): read = spelling -> transport, write =
# transport -> spelling (a homophone writes as its commonest spelling).
# Words the dictionary lacks read letter by letter as a last resort and write
# in the script. Stress is dropped: the system carries none.
code: en
name: English
kind: word
match: word
sample_text: one keyboard, one script, many languages
sources:
  - sources/cmudict.dict     # https://github.com/cmusphinx/cmudict (BSD)
  - sources/en_50k.txt       # https://github.com/hermitdave/FrequencyWords (CC BY-SA 4.0): ranks a homophone's spellings
prefer:                      # homographs whose commoner reading is not CMUdict's first: word -> its (n) variant
  wind: 2                    #   the noun /wɪnd/, not to wind /waɪnd/
  live: 2                    #   /lɪv/
  lead: 2                    #   to lead /liːd/
  read: 2                    #   /riːd/ (the present)
  wound: 2                   #   the injury /wuːnd/
pron:                        # words whose CMUdict readings are all off: word -> ARPAbet
  towards: T UH W AO R D Z   #   tu-, not the schwa tạwórdz or the clipped tórdz
  toward: T UH W AO R D
arpabet:                     # ARPAbet -> transport form (stress digits stripped)
  AA: aw
  AE: a
  AH: aj        # ə and ʌ, merged (mapping.yaml: STRUT is the stressed schwa)
  AO: ow
  AW: aux
  AY: aix
  B: b
  CH: tq
  D: d
  DH: dx
  EH: e
  ER: aq
  EY: eix
  F: f
  G: g
  HH: h
  IH: i
  IY: iw
  JH: dq
  K: k
  L: l
  M: m
  N: n
  NG: nx
  OW: oux
  OY: oix
  P: p
  R: r
  S: s
  SH: sj
  T: t
  TH: tx
  UH: u
  UW: uw
  V: v
  W: ux
  Y: ix
  Z: z
  ZH: zj
assimilated:                 # predictable sounds the dictionary marks, written as the phoneme
  NG:                        # ŋ before k and g: English contrasts n and ŋ nowhere there
    before: [K, G]           # (think, finger), so it is the n; sing, singer keep ŋ
    as: n
