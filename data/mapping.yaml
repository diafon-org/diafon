# The mapping: phoneme (IPA, as written in languages/*.yaml) -> point.
#
# Notation: KEYS are bare IPA symbols, the sounds of the languages. VALUES
# are point names (data/script.yaml), or a list of them where a sound is
# written as a sequence (pʰ: [p, h]). A point's name is the IPA value it was
# frozen with (split.md): it is a name, not a claim about the sound on its
# left, so ʂ: ʃ under Mandarin says that Mandarin's ʂ is written with the
# point named ʃ. Prose (docs, comments) writes IPA between slashes, /S/, to
# keep sounds apart from point names and glyphs.
#
# This is the explicit, reviewable layer between the language metadata and
# everything generated (the points, the master table). The rules the points
# follow are defined in docs/index.html; this file is their application,
# symbol by symbol.
#
# - `consonants` / `vowels`: the global map. A symbol always maps the same
#   way unless a language appears under `overrides`.
# - `overrides`: per-language mapping decisions.
# - `merges`: within one language, two metadata symbols written with the SAME
#   point; each entry is a reviewed claim that they are one phoneme. Any
#   other collision within a language is an error.
# - X (marginal) phonemes are not mapped and never counted.

consonants:
  # bare bases
  m: m
  n: n
  k: k
  l: l
  s: s
  p: p
  t: t
  b: b
  f: f
  g: g
  d: d
  h: h
  r: r
  v: v
  z: z
  # shares riding a base the language leaves free
  t̪: t          # dental fold
  d̪: d
  ʋ: v
  ɹ: r
  ɦ: h
  ɓ: b
  ɗ: d
  ɸ: f
  # marked points
  ʃ: ʃ
  ʒ: ʒ
  tʃ: tʃ
  dʒ: dʒ
  ts: ts
  dz: dz
  x: x
  ɣ: ɣ
  q: q
  ʔ: ʔ      # the shift on h; the dot bears the stop meaning
  ɾ: ɾ
  θ: θ
  ð: ð
  ŋ: ŋ
  pf: [p, f]         # a sequence: German never contrasts pf with p+f
  ħ: ħ          # the back sounds join the emphatics on the double dot below, each on the letter
  ʕ: ʕ          #   it sounds like: k̤ /q/ is the k further back, h̤ /ħ/ the h further back, g̈ /ʕ/
  # shares on marked points
  χ: x
  ʁ: ɣ
  # the hush in all its places is the anchor: one series in a language is ș z̦ c̦ x̦, whatever
  #   its exact sound (Mandarin, Japanese, Russian ш ж); the soft series of a language with
  #   two takes the dot (Polish below, and sʲ zʲ tsʲ)
  ɕ: ʃ
  ʑ: ʒ
  ʂ: ʃ
  ʐ: ʒ
  tʂ: tʃ
  dʐ: dʒ
  tɕ: tʃ
  dʑ: dʒ
  # soft (j)
  pʲ: pʲ
  bʲ: bʲ
  tʲ: c
  dʲ: ɟ
  kʲ: kʲ
  gʲ: gʲ
  mʲ: mʲ
  nʲ: ɲ
  lʲ: ʎ         # the thin stems take the anchor too (Latvian ļ ŗ)
  rʲ: rʲ
  fʲ: fʲ
  vʲ: vʲ
  sʲ: ɕ         # soft s z ts on the dot (ṣ ẓ c̣), beside the hush on the anchor
  zʲ: ʑ
  tsʲ: tɕ
  ɲ: ɲ
  ʎ: ʎ
  c: c
  ɟ: ɟ
  ʝ: ɟ
  r̝: rʲ        # Czech ř, its soft r
  # retroflex: the double dot below
  ʈ: ʈ
  ɖ: ɖ
  ɳ: ɳ
  ɭ: ɭ        # the dot; ḷ is the Indological form, and ḷ was free
  ɻ: ɝ        # the vocalic r; the most vowel-like rhotic
  ɽ: ɾ        # tap and flap contrast nowhere; Indic writes ṛ
  # aspiration
  pʰ: [p, h]        # aspiration is always the sequence with h
  tʰ: [t, h]
  kʰ: [k, h]
  tsʰ: [ts, h]
  tʃʰ: [tʃ, h]
  tɕʰ: [tʃ, h]
  tʂʰ: [tʃ, h]
  t̪ʰ: [t, h]
  ʈʰ: [ʈ, h]   # a sequence: ʈ + h; the special cannot stack on the anti-anchor
  bʱ: [b, h]
  d̪ʱ: [d, h]
  ɖʱ: [ɖ, h]
  dʒʱ: [dʒ, h]
  gʱ: [g, h]
  ɽʱ: [ɾ, h]
  # long (w); Korean fortis rides length
  p͈: pː
  t͈: tː
  k͈: kː
  s͈: sː
  t͈ɕ: tʃː
  ɕː: ɕː        # Russian щ, the long soft hush (ṣṣ)
  # glides
  j: j
  w: w
  ɥ: ɥ

vowels:
  # Each vowel maps to the form of its AREA (see `areas` below): a form
  # covers a phonetic area and reads the same in every language.
  i: i
  ɪ: i
  u: u
  ʊ: u
  e: e
  ɛ: e
  o: o
  ɔ: o
  a: a
  æ: a
  ɑ: a
  ɒ: a
  y: y
  ʏ: y
  ø: ø
  œ: ø
  ɯ: ɯ
  ɨ: ɯ
  ɤ: ɤ
  ʌ: ɤ
  ə: ə
  ɐ: ə
  ɚ: ɝ
  ɝ: ɝ
  # long (w)
  iː: iː
  uː: uː
  eː: eː
  ɛː: eː
  oː: oː
  ɔː: oː
  aː: aː
  æː: aː
  ɑː: aː
  yː: yː
  øː: øː
  ɯː: ɯː
  ɤː: ɤː
  # nasal (y)
  ĩ: ĩ
  ẽ: ẽ
  ɛ̃: ẽ
  œ̃: ẽ          # recessive, merged into ɛ̃ for modern speakers
  ã: ã
  ɑ̃: ã
  õ: õ
  ɔ̃: õ
  ũ: ũ
  # sequences: nucleus + glide
  aɪ: [a, j]
  aʊ: [a, w]
  eɪ: [e, j]
  ɛi: [e, j]
  oʊ: [o, w]
  ɔɪ: [o, j]
  ɔʏ: [o, ɥ]
  œy: [ø, ɥ]
  ʌu: [ɤ, w]

# The vowel areas. A point covers an area of the vowel space and means the
# same in every language: e is the front mid vowel, close or open. Where a
# language contrasts two vowels inside one area, the one listed under
# `split` takes the split point, which also means the same everywhere: ẹ is
# the open-mid ɛ. Only those languages write it, and once a language makes
# the split it writes that vowel split everywhere: long, nasal and in
# diphthongs (German ɔ is ọ in Gott and in Leute, ọj̈). No point is ever read
# two ways. `core` is the area's reference value.
areas:
  i:  {core: i, split: {ɪ: [ɪ]}}
  u:  {core: u, split: {ʊ: [ʊ]}}
  e:  {core: e, split: {ɛ: [ɛ]}}
  o:  {core: o, split: {ɔ: [ɔ]}}
  a:  {core: a, split: {æ: [æ]}}         # the front vowel; ɑ ɒ keep the area (Finnish and Estonian a ä)
  y: {core: y, split: {ʏ: [ʏ]}}
  ø: {core: ø, split: {œ: [œ]}}
  ɯ: {core: ɯ}
  ɤ: {core: ɤ}
  ə: {core: ə}
  ɝ: {core: ɝ}

# Review state of each language's mapping: reviewed (checked against the
# sources); absent entries are not reviewed.
review:
  en: reviewed
  zh: reviewed

overrides:
  en:            # STRUT is the stressed schwa (merges below), not the ɤ area
    ʌ: ə
  ka:            # the ejectives are the bare letters: aspirates are Ch,
    pʼ: p        #   and an outsider's plain reading is the licensed approximation
    tʼ: t
    kʼ: k
    qʼ: q
    tsʼ: ts
    tʃʼ: tʃ
  ar:            # the emphatics: the double dot below, the tongue root drawn back
    tˤ: ʈ
    dˤ: ɖ
    sˤ: sˤ
    ðˤ: ðˤ
  # ru, uk: none. ш ж (ч дж) are the hush, on the anchor; the soft сь зь ць take the dot,
  #   and Russian щ is the long soft one (ṣṣ)
  pt:            # ɐ: the a area (its contrast with a is marginal, European only)
    ɐ: a
  ko:            # ㅐ ㅔ have merged for most speakers: one e (merges below)
    ɛ: e
  ja:            # the moraic nasal ん contrasts with n (kani ~ kan'i): the velar
    ɴ: ŋ        #   nasal's slot, ŋ being no phoneme of Japanese
  zh:            # one mid vowel (pinyin e): ë alone and before n ŋ, [ɤ] [ə]; after u it is [o],
                 #   and the lexicon writes it o there (guo kuo, wo uo)
    ə: ɤ
                 # the retroflexes are the hush, as everywhere (j q x share it before i ü)
  pl:            # three-way sibilants: plain s, the hush sz on the anchor, the soft ś on the dot
    ɕ: ɕ
    ʑ: ʑ
    tɕ: tɕ
    dʑ: dʑ

merges:
  # reviewed within-language identifications: two symbols, one phoneme
  en: [[ʌ, ə]]   # STRUT is the stressed schwa
  de: [[ɛː, eː]] # Ähre ~ Ehre: merged by most speakers; length marks the tense vowel
  ko: [[ɛ, e]]   # ㅐ ~ ㅔ: merged in today's speech
  pt: [[ɐ, a]]   # unstressed or nasal a; the falámos ~ falamos contrast is marginal
  zh: [[ɤ, ə]]   # one phoneme: [ɤ] open, [ə] before nasals

# Multiple readings belong to the double dot below and to the vowel grave. A REGULAR point carries one reading; every
# other reading of any point is justified below, language by language. The
# reading marked `primary` is the point's canonical value (shown aggregated);
# the special has no canonical value, so its first reading is simply its
# largest. The generator fails on any reading of a regular point not listed.
shares:
  t:
    t: primary
    tʼ:
      ka: the ejective; the bare letter is the licensed approximation
    t̪:
      bn: the dental series on the plain slot; retroflex rides y
      hi: the dental series; ʈ is carried by t̤
      ta: dental t̪ against retroflex ʈ (t̤); the plain slot is the dental
  d:
    d: primary
    d̪:
      bn: the dental series on the plain slot
      hi: the dental series; ɖ is carried by d̤
    ɗ:
      vi: implosive realisation of its only voiced coronal stop; the exotic licence
  b:
    b: primary
    ɓ:
      vi: implosive realisation of its only voiced labial stop; the exotic licence
  p:
    p: primary
    pʼ:
      ka: the ejective; the bare letter is the licensed approximation
  k:
    k: primary
    kʼ:
      ka: the ejective; the bare letter is the licensed approximation
  ts:
    ts: primary
    tsʼ:
      ka: the ejective; the bare letter is the licensed approximation
  tʃ:
    tʃ: primary
    tʃʼ:
      ka: the ejective; the bare letter is the licensed approximation
    tʂ:
      zh: zh; retroflex, before all but i ü
      pl: cz; the hush, retroflex; the soft ć takes the dot (c̣)
    tɕ:
      zh: j; alveolo-palatal, before i ü only
      ja: the sole hush affricate, alveolo-palatal
      ko: the sole hush affricate, alveolo-palatal
      ru: ч; the sole hush affricate, soft
      th: the sole hush affricate
      vi: ch; the sole hush affricate
  dʒ:
    dʒ: primary
    dʑ:
      ja: the sole voiced hush affricate, alveolo-palatal
    dʐ:
      pl: dż; the hush, retroflex; the soft dź takes the dot (x̣)
  ʃ:
    ʃ: primary
    ɕ:
      ja: the sole hush, alveolo-palatal
      zh: x; before i ü only
    ʂ:
      zh: sh; retroflex, before all but i ü
      pl: sz; the hush, retroflex; the soft ś takes the dot (ṣ)
      ru: ш; the hush, retroflex; the soft сь takes the dot (ṣ)
  ʒ:
    ʒ: primary
    ʑ:
      ja: the voiced hush, alveolo-palatal
    ʐ:
      zh: r; the sole voiced hush, retroflex
      pl: ż; the hush, retroflex; the soft ź takes the dot (ẓ)
      ru: ж; the hush, retroflex; the soft зь takes the dot (ẓ)
  ɕ:
    ɕ: primary
    sʲ:
      et: the soft s; its marginal ʃ is the hush (ș)
      ru: сь; the soft s, beside the hush ш (ș)
      uk: сь; the soft s, beside the hush ш (ș)
  ʑ:
    ʑ: primary
    zʲ:
      ru: зь; the soft z, beside the hush ж (z̦)
      uk: зь; the soft z, beside the hush ж (z̦)
  tɕ:
    tɕ: primary
    tsʲ:
      uk: ць; the soft ts, beside the hush ч (c̦)
  x:
    x: primary
    χ:
      ka: uvular, one column from velar; no velar x to contrast
  ɣ:
    ɣ: primary
    ʁ:
      ar: ghayn; contrasts the trill r, never ɣ
      de: the uvular R on the voiced velar slot
      fr: the uvular R on the voiced velar slot
      he: resh; the same uvular R
      ka: voiced uvular fricative, one column out
      pt: the strong R, uvular-realised
  q:
    q: primary
    qʼ:
      ka: ejective-only uvular; its lone q, nothing plainer to contrast
  r:
    r: primary
    ɹ:
      en: the only rhotic; the r slot, approximant-realised
  h:
    h: primary
    ɦ:
      cs: voiced h; its only glottal fricative
      uk: г; voiced h, its only glottal fricative
  v:
    v: primary
    ʋ:
      hi: the labial approximant; its only v-like sound
  c:
    c: primary
    tʲ:
      et: the soft t; one phoneme with the palatal stop
      ru: ть; the soft t
      uk: ть; the soft t
  ɟ:
    ɟ: primary
    dʲ:
      ru: дь; the soft d
      uk: дь; the soft d
    ʝ:
      es: yeísmo y; the palatal voiced slot, fricative-realised
  ɲ:
    ɲ: primary
    nʲ:
      et: the soft n; one phoneme with ɲ
      ru: нь; the soft n
      uk: нь; the soft n
  ɾ:
    ɾ: primary
    ɽ:
      bn: flap and tap contrast nowhere; Indic writes ṛ for the flap
      hi: flap and tap contrast nowhere; Indic writes ṛ for the flap
  rʲ:
    rʲ: primary
    r̝:
      cs: ř, its soft r
  ʎ:
    ʎ: primary
    lʲ:
      et: the soft l
      ru: ль, the soft l
      uk: ль, the soft l
  ŋ:
    ŋ: primary
    ɴ:
      ja: ん, the moraic nasal; ŋ is no phoneme of Japanese
  ə:
    ʌ:
      en: STRUT is the stressed schwa (merged in the mapping)
  ɝ:
    ɝ: primary
    ɚ:
      zh: er (儿/二); the same rhotacized schwa
    ɻ:
      ta: ழ; the vocalic r, the most vowel-like rhotic
  # the double dot below: per-language readings by design (none listed)