# The mapping: phoneme (IPA, as written in languages/*.yaml) -> input form.
#
# Notation: KEYS are bare IPA symbols; VALUES are ascii input sequences.
# Prose (docs, comments) always writes IPA between slashes, /S/, to keep it
# apart from input forms and script glyphs.
#
# This is the explicit, reviewable layer between the language metadata and
# everything generated (the master table, the engine). The rules the forms
# follow are defined in docs/index.html; this file is their application,
# symbol by symbol.
#
# - `consonants` / `vowels`: the global map. A symbol always maps the same
#   way unless a language appears under `overrides`.
# - `overrides`: per-language mapping decisions.
# - `merges`: within one language, two metadata symbols written on the SAME
#   form; each entry is a reviewed claim that they are one phoneme. Any
#   other within-language form collision is an error.
# - X (marginal) phonemes are not mapped and never counted.

consonants:
  # bare bases
  m: m
  n: n
  k: k
  l: l
  s: s
  p: p
  t: t
  b: b
  f: f
  g: g
  d: d
  h: h
  r: r
  v: v
  z: z
  # shares riding a base the language leaves free
  t̪: t          # dental fold
  d̪: d
  ʋ: v
  ɹ: r
  ɦ: h
  ɓ: b
  ɗ: d
  ɸ: f
  # marked points
  ʃ: sj
  ʒ: zj
  tʃ: tq
  dʒ: dq
  ts: tc
  dz: dc
  x: kx
  ɣ: gx
  q: kq
  ʔ: hx      # the shift on h; the dot bears the stop meaning
  ɾ: rc
  θ: tx
  ð: dx
  ŋ: nx
  pf: pf         # a sequence: German never contrasts pf with p+f
  ħ: ky          # the pharyngeals join the emphatics on the back-lean:
  ʕ: gy          #   Arabic's back quality across the board; k̖ approximates ḳ /x/
  # shares on marked points
  χ: kx
  ʁ: gx
  ɕ: sj
  ʑ: zj
  ʂ: sjy        # the flipped anchor
  ʐ: zjy
  tʂ: tqy
  tɕ: tq
  dʑ: dq
  # soft (j)
  pʲ: pj
  bʲ: bj
  tʲ: tj
  dʲ: dj
  kʲ: kj
  gʲ: gj
  mʲ: mj
  nʲ: nj
  lʲ: lj         # the thin stems take the anchor too (Latvian ļ ŗ)
  rʲ: rj
  fʲ: fj
  vʲ: vj
  sʲ: sj         # soft s z on the anchor, beside the hush, where the language has
  zʲ: zj         #   no plain hush to contrast (ru uk: ш ж ride the back-lean)
  tsʲ: tq
  ɲ: nj
  ʎ: lj
  c: tj
  ɟ: dj
  ʝ: dj
  r̝: rj        # Czech ř, its soft r
  # retroflex (y); the back-lean
  ʈ: ty
  ɖ: dy
  ɳ: ny
  ɭ: lx        # the dot; ḷ is the Indological form, and lx was free
  ɻ: aq        # the vocalic r; the most vowel-like rhotic
  ɽ: rc        # tap and flap contrast nowhere; Indic writes ṛ
  # aspiration
  pʰ: ph        # aspiration is always the sequence with h
  tʰ: th
  kʰ: kh
  tsʰ: tch
  tʃʰ: tqh
  tɕʰ: tqh
  tʂʰ: tqyh
  t̪ʰ: th
  ʈʰ: tyh   # a sequence: ʈ + h; the special cannot stack on the anti-anchor
  bʱ: bh
  d̪ʱ: dh
  ɖʱ: dyh
  dʒʱ: dqh
  gʱ: gh
  ɽʱ: rch
  # long (w); Korean fortis rides length
  p͈: pw
  t͈: tw
  k͈: kw
  s͈: sw
  t͈ɕ: tqw
  ɕː: sjw        # Russian щ, the long hush
  # glides
  j: ix
  w: ux
  ɥ: icx

vowels:
  # Each vowel maps to the form of its AREA (see `areas` below): a form
  # covers a phonetic area and reads the same in every language.
  i: i
  ɪ: i
  u: u
  ʊ: u
  e: e
  ɛ: e
  o: o
  ɔ: o
  a: a
  æ: a
  ɑ: a
  ɒ: a
  y: ic
  ʏ: ic
  ø: ec
  œ: ec
  ɯ: uc
  ɨ: uc
  ɤ: oc
  ʌ: oc
  ə: aj
  ɐ: aj
  ɚ: aq
  ɝ: aq
  # long (w)
  iː: iw
  uː: uw
  eː: ew
  ɛː: ew
  oː: ow
  ɔː: ow
  aː: aw
  æː: aw
  ɑː: aw
  yː: icw
  øː: ecw
  ɯː: ucw
  ɤː: ocw
  # nasal (y)
  ĩ: iy
  ẽ: ey
  ɛ̃: ey
  œ̃: ey          # recessive, merged into ɛ̃ for modern speakers
  ã: ay
  ɑ̃: ay
  õ: oy
  ɔ̃: oy
  ũ: uy
  # sequences: nucleus + glide
  aɪ: aix
  aʊ: aux
  eɪ: eix
  ɛi: eix
  oʊ: oux
  ɔɪ: oix
  ɔʏ: oicx
  œy: ecicx
  ʌu: ocux

# The vowel areas. A form covers an area of the vowel space and means the
# same in every language: e is the front mid vowel, close or open. Where a
# language contrasts two vowels inside one area, the one listed under
# `split` takes the split form, which also means the same everywhere: ẹ is
# the open-mid ɛ. Only those languages write it, and once a language makes
# the split it writes that vowel split everywhere: long, nasal and in
# diphthongs (German ɔ is ọ in Gott and in Leute, ọj̈). No form is ever read
# two ways. `core` is the area's reference value.
areas:
  i:  {core: i, split: {ij: [ɪ]}}
  u:  {core: u, split: {uj: [ʊ]}}
  e:  {core: e, split: {ej: [ɛ]}}
  o:  {core: o, split: {oj: [ɔ]}}
  a:  {core: a, split: {ac: [ɑ, ɒ]}}      # the open back vowel; æ keeps the area
  ic: {core: y, split: {iq: [ʏ]}}
  ec: {core: ø, split: {eq: [œ]}}
  uc: {core: ɯ}
  oc: {core: ɤ}
  aj: {core: ə}
  aq: {core: ɝ}

# Review state of each language's mapping. Full confidence requires a native
# or expert reviewer per language; absent entries are non-reviewed.
# States: reviewed (checked against the sources) · native (native/expert-reviewed)
review:
  en: reviewed
  hu: native
  zh: reviewed

overrides:
  en:            # STRUT is the stressed schwa (merges below), not the ɤ area
    ʌ: aj
  ka:            # the ejectives are the bare letters: aspirates are Ch,
    pʼ: p        #   and an outsider's plain reading is the licensed approximation
    tʼ: t
    kʼ: k
    qʼ: kq
    tsʼ: tc
    tʃʼ: tq
  ar:            # the emphatics: the back-lean, the tongue root drawn back
    tˤ: ty
    dˤ: dy
    sˤ: sjy
    ðˤ: zjy
  # ru: none. ш ж are retroflex, on the back-lean (the global ʂ ʐ) as Polish sz ż;
  #   the anchor is the soft s z, as on every other soft consonant; щ is long (sjw)
  uk:            # ш ж ч дж on the back-lean, as Russian; the anchor is soft s z ts
    ʃ: sjy
    ʒ: zjy
    tʃ: tqy
    dʒ: dqy
  pt:            # ɐ: the a area (its contrast with a is marginal, European only)
    ɐ: a
  ko:            # ㅐ ㅔ have merged for most speakers: one e (merges below)
    ɛ: e
  hi:            # the inherent vowel: a, Hindi having no short /a/ (á is /aː/)
    ə: a
  ja:            # the moraic nasal ん contrasts with n (kani ~ kan'i): the velar
    ɴ: nx        #   nasal's slot, ŋ being no phoneme of Japanese
  zh:            # one mid vowel (pinyin e): ë throughout, [ə] before n ŋ as [ɤ] elsewhere
    ə: oc
                 # the retroflexes are the hush: no plain hush to contrast
    ʂ: sj        #   (j q x share it before i ü), so the back-lean is unsigned
    ʐ: zj
    tʂ: tq
    tʂʰ: tqh

  pl:            # three-way sibilants: plain / anchored / flipped
    ʂ: sjy
    ʐ: zjy
    tʂ: tqy
    dʐ: dqy

merges:
  # reviewed within-language identifications: two symbols, one phoneme
  en: [[ʌ, ə]]   # STRUT is the stressed schwa
  de: [[ɛː, eː]] # Ähre ~ Ehre: merged by most speakers; length marks the tense vowel
  ko: [[ɛ, e]]   # ㅐ ~ ㅔ: merged in today's speech
  pt: [[ɐ, a]]   # unstressed or nasal a; the falámos ~ falamos contrast is marginal
  zh: [[ɤ, ə]]   # one phoneme: [ɤ] open, [ə] before nasals

# Multiple readings belong to the back-lean (y) family and to the vowel grave. A REGULAR form carries one reading; every
# other reading of any form is justified below, language by language. The
# reading marked `primary` is the form's canonical value (shown aggregated);
# the special has no canonical value, so its first reading is simply its
# largest. The generator fails on any reading of a regular form not listed.
shares:
  t:
    t: primary
    tʼ:
      ka: the ejective; the bare letter is the licensed approximation
    t̪:
      bn: the dental series on the plain slot; retroflex rides y
      hi: the dental series; ʈ is carried by ty
      ta: dental t̪ against retroflex ʈ (ty); the plain slot is the dental
  d:
    d: primary
    d̪:
      bn: the dental series on the plain slot
      hi: the dental series; ɖ is carried by dy
    ɗ:
      vi: implosive realisation of its only voiced coronal stop; the exotic licence
  b:
    b: primary
    ɓ:
      vi: implosive realisation of its only voiced labial stop; the exotic licence
  p:
    p: primary
    pʼ:
      ka: the ejective; the bare letter is the licensed approximation
  k:
    k: primary
    kʼ:
      ka: the ejective; the bare letter is the licensed approximation
  tc:
    ts: primary
    tsʼ:
      ka: the ejective; the bare letter is the licensed approximation
  tq:
    tʃ: primary
    tʃʼ:
      ka: the ejective; the bare letter is the licensed approximation
    tʂ:
      zh: zh; retroflex, before all but i ü
    tɕ:
      zh: j; alveolo-palatal, before i ü only
      ja: the sole hush affricate, alveolo-palatal
      ko: the sole hush affricate, alveolo-palatal
      pl: ć; its second hush cz takes the flip (tqy)
      ru: ч; the sole hush affricate, soft
    tsʲ:
      uk: ць; the soft ts on the anchor, ч riding the back-lean (tqy)
      th: the sole hush affricate
      vi: ch; the sole hush affricate
  dq:
    dʒ: primary
    dʑ:
      ja: the sole voiced hush affricate, alveolo-palatal
      pl: dź; its second hush dż takes the flip (dqy)
  sj:
    ʃ: primary
    ɕ:
      ja: the sole hush, alveolo-palatal
      zh: x; before i ü only
      pl: ś; its second hush sz takes the flip (sjy)
    ʂ:
      zh: sh; retroflex, before all but i ü
    sʲ:
      et: the soft s; ʃ is marginal
      ru: сь; the soft s, ш riding the back-lean (sjy)
      uk: сь; the soft s, ш riding the back-lean (sjy)
  zj:
    ʒ: primary
    ʑ:
      pl: ź; its second hush ż takes the flip (zjy)
    ʐ:
      zh: r; the sole voiced hush, retroflex
    zʲ:
      ru: зь; the soft z, ж riding the back-lean (zjy)
      uk: зь; the soft z, ж riding the back-lean (zjy)
  kx:
    x: primary
    χ:
      ka: uvular, one column from velar; no velar x to contrast
  gx:
    ɣ: primary
    ʁ:
      ar: ghayn; contrasts the trill r, never ɣ
      de: the uvular R on the voiced velar slot
      fr: the uvular R on the voiced velar slot
      he: resh; the same uvular R
      ka: voiced uvular fricative, one column out
      pt: the strong R, uvular-realised
  kq:
    q: primary
    qʼ:
      ka: ejective-only uvular; its lone q, nothing plainer to contrast
  r:
    r: primary
    ɹ:
      en: the only rhotic; the r slot, approximant-realised
  h:
    h: primary
    ɦ:
      cs: voiced h; its only glottal fricative
      uk: г; voiced h, its only glottal fricative
  v:
    v: primary
    ʋ:
      hi: the labial approximant; its only v-like sound
  tj:
    c: primary
    tʲ:
      et: the soft t; one phoneme with the palatal stop
      ru: ть; the soft t
      uk: ть; the soft t
  dj:
    ɟ: primary
    dʲ:
      ru: дь; the soft d
      uk: дь; the soft d
    ʝ:
      es: yeísmo y; the palatal voiced slot, fricative-realised
  nj:
    ɲ: primary
    nʲ:
      et: the soft n; one phoneme with ɲ
      ru: нь; the soft n
      uk: нь; the soft n
  rc:
    ɾ: primary
    ɽ:
      bn: flap and tap contrast nowhere; Indic writes ṛ for the flap
      hi: flap and tap contrast nowhere; Indic writes ṛ for the flap
  rj:
    rʲ: primary
    r̝:
      cs: ř, its soft r
  lj:
    ʎ: primary
    lʲ:
      et: the soft l
      ru: ль, the soft l
      uk: ль, the soft l
  nx:
    ŋ: primary
    ɴ:
      ja: ん, the moraic nasal; ŋ is no phoneme of Japanese
  aj:
    ʌ:
      en: STRUT is the stressed schwa (merged in the mapping)
  aq:
    ɝ: primary
    ɚ:
      zh: er (儿/二); the same rhotacized schwa
    ɻ:
      ta: ழ; the vocalic r, the most vowel-like rhotic
  # the back-lean: per-language readings by design (none listed)