# The mapping: phoneme (IPA, as written in languages/*.yaml) -> input form.
#
# Notation: KEYS are bare IPA symbols; VALUES are ascii input sequences.
# Prose (docs, comments) always writes IPA between slashes, /S/, to keep it
# apart from input forms and script glyphs.
#
# This is the explicit, reviewable layer between the language metadata and
# everything generated (the master table, the engine). The rules the forms
# follow are defined in docs/index.html; this file is their application,
# symbol by symbol.
#
# - `consonants` / `vowels`: the global map. A symbol always maps the same
#   way unless a language appears under `overrides`.
# - `overrides`: per-language mapping decisions.
# - `merges`: within one language, two metadata symbols written on the SAME
#   form; each entry is a reviewed claim that they are one phoneme. Any
#   other within-language form collision is an error.
# - X (marginal) phonemes are not mapped and never counted.

consonants:
  # bare bases
  m: m
  n: n
  k: k
  l: l
  s: s
  p: p
  t: t
  b: b
  f: f
  g: g
  d: d
  h: h
  r: r
  v: v
  z: z
  # shares riding a base the language leaves free
  t̪: t          # dental fold
  d̪: d
  ʋ: v
  ɹ: r
  ɦ: h
  ɓ: b
  ɗ: d
  ɸ: f
  # marked points
  ʃ: sj
  ʒ: zj
  tʃ: tq
  dʒ: dq
  ts: tc
  dz: dc
  x: kx
  ɣ: gx
  q: kq
  ʔ: hx      # the shift on h; the dot bears the stop meaning
  ɾ: rc
  θ: tx
  ð: dx
  ŋ: nx
  pf: pf         # a sequence: German never contrasts pf with p+f
  ħ: kxy         # the pharyngeals join the emphatics: Arabic's special is
  ʕ: gxy         #   pharyngeal quality across the board; k̤ approximates ḳ /x/
  # shares on marked points
  χ: kx
  ʁ: gx
  ɕ: sj
  ʑ: zj
  ʂ: sjy        # the flipped anchor
  ʐ: zjy
  tʂ: tqy
  tɕ: tq
  dʑ: dq
  # soft (j)
  pʲ: pj
  bʲ: bj
  tʲ: tj
  dʲ: dj
  kʲ: kj
  gʲ: gj
  mʲ: mj
  nʲ: nj
  lʲ: lxy
  rʲ: rxy
  ɲ: nj
  ʎ: lxy
  c: tj
  ɟ: dj
  ʝ: dj
  r̝: rxy       # Czech ř, its special r
  # retroflex (y); the back-lean
  ʈ: ty
  ɖ: dy
  ɳ: ny
  ɭ: lx        # the dot; ḷ is the Indological form, and lx was free
  ɻ: aq        # the vocalic r; the most vowel-like rhotic
  ɽ: rc        # tap and flap contrast nowhere; Indic writes ṛ
  # the special: secondary y on a marked form, the pair yx on a bare letter
  pʰ: ph        # aspiration is always the sequence with h
  tʰ: th
  kʰ: kh
  tsʰ: tch
  tʃʰ: tqh
  tɕʰ: tqh
  tʂʰ: tqyh
  t̪ʰ: th
  ʈʰ: tyh   # a sequence: ʈ + h; the special cannot stack on the anti-anchor
  bʱ: bh
  d̪ʱ: dh
  ɖʱ: dyh
  dʒʱ: dqh
  gʱ: gh
  ɽʱ: rch
  # long (w); Korean fortis rides length
  p͈: pw
  t͈: tw
  k͈: kw
  s͈: sw
  t͈ɕ: tqw
  ɕː: sjw        # Russian щ, the long hush
  # glides
  j: ix
  w: ux
  ɥ: icx

vowels:
  # bases and points
  i: i
  u: u
  a: a
  o: o
  e: e
  ɛ: ej
  ɔ: oj
  ɪ: ij
  ʊ: uj
  ə: aj
  ɑ: ac
  ɒ: ac
  y: ic
  ø: ec
  ɯ: uc
  ɤ: oc
  œ: eq
  ʏ: iq
  ɚ: aq
  ɝ: aq
  # shares
  ʌ: aj          # stressed schwa (EN, KO)
  ɐ: aj
  æ: a
  ɨ: uc
  # long (w)
  aː: aw
  iː: iw
  uː: uw
  eː: ew
  oː: ow
  ɛː: ejw
  ɔː: ojw
  øː: ecw
  yː: icw
  ɯː: ucw
  ɤː: ocw
  æː: aw
  ɑː: acw
  # nasal (y)
  ĩ: iy
  ẽ: ey
  ã: ay
  õ: oy
  ũ: uy
  ɑ̃: ay          # FR, HI; the a slot; nasal on ä would stack two above
  ɛ̃: ejy
  œ̃: ejy         # recessive, merged into ɛ̃ for modern speakers
  ɔ̃: ojy
  # sequences: nucleus + glide
  aɪ: aix
  aʊ: aux
  ɔɪ: ojix
  eɪ: eix
  oʊ: oux
  ɔʏ: ojicx
  ɛi: ejix
  œy: eqicx
  ʌu: ajux

# Review state of each language's mapping. Full confidence requires a native
# or expert reviewer per language; absent entries are non-reviewed.
# States: reviewed (checked against the sources) · native (native/expert-reviewed)
review:
  en: reviewed
  hu: native
  zh: reviewed

overrides:
  ka:            # the ejectives are the bare letters: aspirates are Ch,
    pʼ: p        #   and an outsider's plain reading is the licensed approximation
    tʼ: t
    kʼ: k
    qʼ: kq
    tsʼ: tc
    tʃʼ: tq
  ar:            # the emphatics = the special
    tˤ: txy
    dˤ: dxy
    sˤ: sxy
    ðˤ: zxy
  ru:            # soft s z: the anchor is taken by the hush points
    sʲ: sxy      #   f v follow them, the anchor sitting badly on their stems
    zʲ: zxy
    fʲ: fxy
    vʲ: vxy
  uk:
    sʲ: sxy
    zʲ: zxy
    tsʲ: tcy    # the anchor on c would collide with c̦ /tʃ/
  et:
    sʲ: sxy
  ja:            # the moraic nasal ん contrasts with n (kani ~ kan'i); it is
    ɴ: nxy       #   Japanese's special; its yx is otherwise unspent

  pl:            # three-way sibilants: plain / anchored / flipped
    ʂ: sjy
    ʐ: zjy
    tʂ: tqy
    dʐ: dqy

merges:
  # reviewed within-language identifications: two symbols, one phoneme
  en: [[ʌ, ə]]   # STRUT is the stressed schwa

# Multiple readings belong to the back-lean (y) and the special (xy / secondary
# y) families, and to the vowel grave. A REGULAR form carries one reading; every
# other reading of any form is justified below, language by language. The
# reading marked `primary` is the form's canonical value (shown aggregated);
# the special has no canonical value, so its first reading is simply its
# largest. The generator fails on any reading of a regular form not listed.
shares:
  t:
    t: primary
    tʼ:
      ka: the ejective; the bare letter is the licensed approximation
    t̪:
      bn: the dental series on the plain slot; retroflex rides y
      hi: the dental series; ʈ is carried by ty
      ta: dental t̪ against retroflex ʈ (ty); the plain slot is the dental
  d:
    d: primary
    d̪:
      bn: the dental series on the plain slot
      hi: the dental series; ɖ is carried by dy
    ɗ:
      vi: implosive realisation of its only voiced coronal stop; the exotic licence
  b:
    b: primary
    ɓ:
      vi: implosive realisation of its only voiced labial stop; the exotic licence
  p:
    p: primary
    pʼ:
      ka: the ejective; the bare letter is the licensed approximation
  k:
    k: primary
    kʼ:
      ka: the ejective; the bare letter is the licensed approximation
  tc:
    ts: primary
    tsʼ:
      ka: the ejective; the bare letter is the licensed approximation
  tq:
    tʃ: primary
    tʃʼ:
      ka: the ejective; the bare letter is the licensed approximation
    tɕ:
      ja: the sole hush affricate, alveolo-palatal
      ko: the sole hush affricate, alveolo-palatal
      pl: ć; its second hush cz takes the flip (tqy)
      ru: ч; the sole hush affricate
      th: the sole hush affricate
      vi: ch; the sole hush affricate
  dq:
    dʒ: primary
    dʑ:
      ja: the sole voiced hush affricate, alveolo-palatal
      pl: dź; its second hush dż takes the flip (dqy)
  sj:
    ʃ: primary
    ɕ:
      ja: the sole hush, alveolo-palatal
      pl: ś; its second hush sz takes the flip (sjy)
  zj:
    ʒ: primary
    ʑ:
      pl: ź; its second hush ż takes the flip (zjy)
  kx:
    x: primary
    χ:
      ka: uvular, one column from velar; no velar x to contrast
  gx:
    ɣ: primary
    ʁ:
      ar: ghayn; contrasts the trill r, never ɣ
      de: the uvular R on the voiced velar slot
      fr: the uvular R on the voiced velar slot
      he: resh; the same uvular R
      ka: voiced uvular fricative, one column out
      pt: the strong R, uvular-realised
  kq:
    q: primary
    qʼ:
      ka: ejective-only uvular; its lone q, nothing plainer to contrast
  r:
    r: primary
    ɹ:
      en: the only rhotic; the r slot, approximant-realised
  h:
    h: primary
    ɦ:
      cs: voiced h; its only glottal fricative
      uk: г; voiced h, its only glottal fricative
  v:
    v: primary
    ʋ:
      hi: the labial approximant; its only v-like sound
  tj:
    c: primary
    tʲ:
      et: the soft t; one phoneme with the palatal stop
      ru: ть; the soft t
      uk: ть; the soft t
  dj:
    ɟ: primary
    dʲ:
      ru: дь; the soft d
      uk: дь; the soft d
    ʝ:
      es: yeísmo y; the palatal voiced slot, fricative-realised
  nj:
    ɲ: primary
    nʲ:
      et: the soft n; one phoneme with ɲ
      ru: нь; the soft n
      uk: нь; the soft n
  rc:
    ɾ: primary
    ɽ:
      bn: flap and tap contrast nowhere; Indic writes ṛ for the flap
      hi: flap and tap contrast nowhere; Indic writes ṛ for the flap
  rxy:
    rʲ: primary
    r̝:
      cs: ř, its special r
  lxy:
    ʎ: primary
    lʲ:
      et: the soft l, its special
      ru: ль, the soft l
      uk: ль, the soft l
  a:
    a: primary
    æ:
      en: its open front vowel; ɑ sits on ä
      et: the ä~a pair carries back ɑ against front æ
      fa: æ is the open front; the rounded back sits on ä
      fi: as Estonian; ɑ on ä, æ on the open slot
  ac:
    ɒ: primary          # c is the rounding flip: the flipped a is the ROUNDED open vowel
    ɑ:
      en: unrounded open back; no ɒ to contrast; one step from a, which æ holds
      et: unrounded open back; the flip slot carries its ɑ against æ on a
      fi: as Estonian; ɑ on the flip, æ on a
      hi: the unrounded ā; no ɒ to contrast
      nl: unrounded open back; no ɒ to contrast
  aj:
    ə: primary
    ʌ:
      en: stressed schwa (merged in the mapping)
      ko: ㅓ; mid back unrounded, no schwa to contrast
    ɐ:
      pt: the reduced a; its only central vowel
  uc:
    ɯ: primary
    ɨ:
      pl: y; central and back unrounded are interchangeable
      ro: î/â; the same interchangeable close unrounded
      vi: ư; the same
      zh: the apical vowel of zhi/shi/si; closest unrounded slot
  aw:
    aː: primary
    æː:
      et: the long æ; the a-share carried through length
      fi: the long æ; the a-share carried through length
  aq:
    ɝ: primary
    ɚ:
      zh: er (儿/二); the same rhotacized schwa
    ɻ:
      ta: ழ; the vocalic r, the most vowel-like rhotic
  ay:
    ã: primary
    ɑ̃:
      fr: the nasal low vowel, back-realised; nasal on ä would stack two marks above
      hi: the nasal low vowel on the plain a slot
  # the special and the back-lean: per-language readings by design
  sxy:
    sˤ: primary
    sʲ:
      et: the soft s; the anchor is taken by the hush point
      ru: сь; the soft s
      uk: сь; the soft s
  zxy:
    ðˤ: primary
    zʲ:
      ru: зь; the soft z
      uk: зь; the soft z
